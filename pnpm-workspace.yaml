# Vaipakam monorepo workspace layout.
#
# `apps/` holds runnable surfaces — each is its own deployable
# (Vite SPA, Cloudflare Worker, etc.):
#   - apps/defi    in-app surface served at defi.vaipakam.com
#                   (formerly the top-level frontend/)
#   - apps/www     marketing + docs site → www.vaipakam.com
#                   (canonical) + vaipakam.com (apex 301 → www).
#                   Folder renamed from `apps/labs` in the labs →
#                   www cutover; labs.vaipakam.com now serves a
#                   Cloudflare Bulk Redirect to the new canonical
#                   for ≥6 months so old indexed URLs hand their
#                   PageRank forward. Wallet-free.
#   - apps/agent   read/index Cloudflare Worker → agent.vaipakam.com
#   - apps/indexer chain → D1 ingester        → indexer.vaipakam.com
#   - apps/keeper  autonomous keeper Worker   → keeper.vaipakam.com
#
# `packages/` holds shared internal libraries — no deploy of their
# own, consumed by the apps via workspace `:` protocol:
#   - packages/contracts  ABI JSONs + deployments + ChainConfig
#   - packages/ui         shared React components
#   - packages/lib        shared utilities (formatters, multicall, ...)
#
# `contracts/` (Foundry) is intentionally NOT in this workspace —
# it's a Solidity project, not a JS package. Its build tooling
# (`forge`) operates on its own root.
#
# `alpha/` (the FROZEN ARCHIVE root that held `alpha/frontend` and
# `alpha/hf-watcher`) was removed in the Phase 4 cleanup of issue #135.
# It had been scheduled for `rm -rf alpha/` once the Stage 3+4
# successors (apps/defi, apps/keeper, apps/indexer, apps/agent) had been
# live without a fallback being needed. The two Cloudflare Workers that
# were last built from the archive sources — `vaipakam-alpha` (formerly
# bound to alpha.vaipakam.com) and `vaipakam-hf-watcher` — are operator-
# managed; undeploying them is a Cloudflare-dashboard action, not a
# repo change. If a fallback is ever needed, `git checkout main~ -- alpha`
# from the commit that deleted the tree restores it byte-for-byte.
#
# `ops/*` is internal operator tooling and stays outside the apps/*
# workspace:
#   - ops/mesh-watcher   VPFI recycling mesh invariant watcher
#                        (#1222 M3 B4-c). A Cloudflare Worker, but
#                        deliberately separate for trust-boundary
#                        reasons — its own D1 and the ops-internal
#                        Telegram bot, never the user-facing one. Its
#                        typecheck + vitest run in ci.yml's
#                        `ops/mesh-watcher` job, not the `workspaces`
#                        job, precisely because it is not a member here.
#   - ops/subgraph       drift subgraph; runs on The Graph.
#   - ops/tenderly       alert presets; deploy via the Tenderly CLI.
#   - ops/offchain-data-warm  nightly D1 backup Worker.
#   (ops/lz-watcher, the LayerZero security monitor, is GONE. Its
#    Cloudflare Worker was deleted 2026-07-28 — the T-068 CCIP migration
#    and the #687-A securities excision had between them made every
#    surface it polled dead — and the source tree was removed with it in
#    #1440, after review established that no wrangler.jsonc edit can make
#    a source tree undeployable: the positional `wrangler deploy
#    src/index.ts --triggers ...` form bypasses config entirely. Recover
#    from git history if it is ever needed.)
#
# `vaipakam-keeper-bot` is a separate sibling repo (extracted
# Phase 9.A) and stays separate — not part of this workspace.
packages:
  - 'apps/*'
  - 'packages/*'
