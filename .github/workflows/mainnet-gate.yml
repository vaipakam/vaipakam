# Mainnet gate — hard-gate workflow that runs the FULL forge regression
# as a required check before any release-track commit can ship to mainnet.
#
# Why this exists: the routine PR CI (ci.yml) runs only the narrow
# deploy-sanity + positive-flow surface (`contracts-fast` under the
# `cifast` foundry profile) as a required check on every CONTRACTS-
# touching PR. The full 2,012-test regression is deliberately NOT in
# per-PR CI (its ~17.7 GB cold-build RSS overruns the 16 GB
# ubuntu-latest ceiling — see #296 / ADR-0006). Full regression is an
# operator-local responsibility at end-of-step + mainnet preflight.
#
# This workflow is the release-track full-regression gate — it runs
# `predeploy-check.sh --full` on `ubuntu-latest` runners, under the
# default foundry profile, as the preflight `deploy-mainnet.sh` invokes
# at step [1b], sharded as described below. So a force-push
# between PR merge and tag, or any drift between the operator's
# local box and the artifact lineage being shipped, is caught
# before deploy.
#
# Runner fit (#2714 / #2770): `predeploy-check.sh --full` delegates to
# `run-regression.sh`, which splits the suite into chunked `--match-path`
# invocations sized to stay under the viaIR whole-unit stack ceiling, so
# peak memory is bounded by the largest chunk, not the whole corpus. What
# did NOT fit was TIME: run as one job, the chunks are sequential and each
# re-compiles the deploy script and facets (#2718), and a single
# `ubuntu-latest` job took 4 h 16 min end to end on 2026-10-24 (run
# 40055515200, measured with no timeout): 17 min of build and guards, then
# 25 chunks taking 238 min in total (6-17 min each), at a peak of 12.5 GB,
# against a 45-minute limit nobody had measured. So the regression is SHARDED across a matrix of runners: each
# runs the whole preflight with the regression cut to every Nth chunk
# (`--shard i/N`), and `mainnet-gate-full` verifies the shards' manifests
# cover every chunk once (`--verify-shards`). Memory per runner is
# unchanged, since no chunk grows. If a chunk ever proves too large,
# `CHUNK_SIZE` / `SUBDIR_CHUNK_SIZE` still tune it down; if a shard runs
# long, add a matrix entry.
#
# This workflow is the safety net at the line that matters: before a
# release-track commit hits any deployable branch / tag, the full
# regression MUST pass. Triggers:
#
#   - push to `release/*` branches (e.g. `release/v0.1.0`, `release/sepolia`)
#   - push of a `v*` tag (the mainnet-deploy artifact lineage)
#
# Each trigger runs `bash contracts/script/predeploy-check.sh --full`, the
# preflight `deploy-mainnet.sh` invokes at step [1b], split into shards whose
# union is verified to be the whole regression. So a mainnet cutover that
# follows the release-train can't ship a state the deploy script would
# reject.
#
# Required-status-check enforcement: when a release/* branch is created
# or a v* tag is pushed, this workflow runs. To gate merges INTO
# release/* branches, add a separate ruleset (similar to `Protect main`)
# scoped to refs/heads/release/* with `mainnet-gate-full` as a required
# context. The default `Protect main` ruleset does NOT require this
# workflow — it stays scoped to the release track on purpose.

name: mainnet-gate

on:
  push:
    branches:
      - 'release/**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - 'release/**'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for the manual run (audit prep, hot patch, etc.)'
        required: false
        default: ''

concurrency:
  # Per-ref serialisation — a new push to the same release/* branch
  # cancels the older in-flight run.
  group: mainnet-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The full regression, SHARDED across parallel runners (#2770). Each shard
  # runs the complete preflight (`predeploy-check.sh --full`) with step 2
  # restricted to its share of the regression's chunks, so every static check
  # still runs on every shard, and every chunk's compile unit is the same size
  # as in the unsharded run: a shard needs no more memory than before, it just
  # carries a fraction of the chunks. The union is verified by the
  # `mainnet-gate-full` job below, which is the check a ruleset should require.
  #
  # To change the shard count, edit `shard:` only; the count passed to the
  # script is the matrix size (`strategy.job-total`), so the two cannot drift.
  regression-shard:
    name: mainnet-gate shard ${{ matrix.shard }}/${{ strategy.job-total }}
    runs-on: ubuntu-latest
    # Measured. Run 40055515200 (#2714) timed every chunk unsharded. Run
    # 40072735019 then ran FOUR shards: 60, 81, 100 and 102 min, of which
    # about 24 min is the build and guards every shard repeats. 102 against
    # 120 was too thin, so there are five: by the same chunk times a shard's
    # chunks drop from 65-77 to about 56-66 min, about 90 min a shard. Add a
    # matrix entry before raising this.
    timeout-minutes: 120
    strategy:
      # Every shard runs to completion even when one fails, so one red run
      # names every failing chunk.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    defaults:
      run:
        working-directory: contracts

    steps:
      - name: Checkout (with submodules — chainlink-evm, OZ, diamond-3, etc.)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          # PINNED by number, never `stable` (#1984, owner decision
          # 2026-10-28): the release gate's compiler must not change without a
          # commit. v1.8.6 ran the last green sharded full regression
          # (2026-10-25) and has the Foundry fix for stale cached bytecode
          # behind `type(X).runtimeCode` that `test/helpers/LibOneTx*Fill`
          # need, which is why this is not ci.yml's v1.8.3. Bump it by PR, in
          # the same change as the three e2e workflows.
          version: v1.8.6

      # Same content-based cache key as `ci.yml` — release branches share
      # the same artifact lineage as main branches, so warm hits from
      # ci.yml runs benefit this workflow too (and vice versa).
      - name: Snapshot submodule SHAs (for content-based cache key)
        working-directory: contracts
        run: git submodule status --recursive > .submodule-state

      - name: Cache forge artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            contracts/out
            contracts/cache
          key: forge-${{ runner.os }}-${{ hashFiles('contracts/foundry.toml', 'contracts/remappings.txt', 'contracts/.submodule-state') }}-${{ hashFiles('contracts/src/**/*.sol', 'contracts/script/**/*.sol', 'contracts/test/**/*.sol') }}
          restore-keys: |
            forge-${{ runner.os }}-${{ hashFiles('contracts/foundry.toml', 'contracts/remappings.txt', 'contracts/.submodule-state') }}-

      # The actual hard gate, one shard of it. The same invocation
      # `deploy-mainnet.sh` runs at preflight step [1b], with the regression
      # step cut to this shard's chunks. The manifest records what it ran.
      - name: Pre-deploy check (full regression, shard ${{ matrix.shard }}/${{ strategy.job-total }})
        run: |
          mkdir -p "$RUNNER_TEMP/regression-manifest"
          bash script/predeploy-check.sh --full \
            --shard "${{ matrix.shard }}/${{ strategy.job-total }}" \
            --manifest "$RUNNER_TEMP/regression-manifest/shard-${{ matrix.shard }}.tsv"

      # Uploaded even when the shard failed, so the verifier can name the
      # failing chunks rather than only a missing manifest.
      - name: Upload this shard's manifest
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: regression-manifest-${{ matrix.shard }}
          path: ${{ runner.temp }}/regression-manifest/shard-${{ matrix.shard }}.tsv
          if-no-files-found: ignore
          retention-days: 30

      # On v* tags, also print the resolved compiler version + facet
      # bytecode sizes for audit-trail capture in the workflow run log.
      # No code change, just observable evidence the build that gated
      # the release matched the configured solc + size budget. Once, on
      # shard 1. `--skip test`: the facets are in src/, and a bare
      # `forge build` compiles the whole test tree (#636).
      - name: Audit trail — solc + facet sizes
        if: startsWith(github.ref, 'refs/tags/v') && matrix.shard == 1
        run: |
          forge --version
          echo
          echo "Facet runtime bytecode sizes (EIP-170 ceiling = 24576 bytes):"
          forge build --skip test --sizes 2>&1 | grep -E '^[ │]+[A-Z][a-zA-Z0-9]+(Facet|Library|Diamond)\b' || true

  # The gate's verdict, under the job name the ruleset note above refers to.
  # Green only when every shard succeeded AND their manifests are N distinct
  # shards of the plan this commit builds that between them passed every
  # chunk exactly once (`run-regression.sh --verify-shards`). The first
  # condition covers each shard's static steps, which a manifest does not
  # record; the second covers a shard missing from the matrix, a shard split
  # a different number of ways, or one whose environment changed the plan.
  mainnet-gate-full:
    name: mainnet-gate-full (forge + predeploy-check --full)
    needs: regression-shard
    # Runs when a shard failed too, so the run says which chunks.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: contracts

    steps:
      # The plan is built from the test tree alone (no compile), so no
      # submodules and no Foundry.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Download every shard's manifest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: regression-manifest-*
          path: ${{ runner.temp }}/regression-manifest
          merge-multiple: true

      - name: Every chunk ran once, on one shard, and passed
        run: bash script/run-regression.sh --verify-shards "$RUNNER_TEMP/regression-manifest"

      - name: Every shard succeeded
        env:
          SHARDS: ${{ needs.regression-shard.result }}
        run: |
          echo "regression-shard: $SHARDS"
          [ "$SHARDS" = success ]
