# keeper e2e — the keeper's Anvil scenarios (#2496): the REAL keeper passes,
# exactly as the scheduler calls them, against the repository's CURRENT
# contracts deployed from source onto a local anvil and configured as a
# single-chain canonical reward deployment (apps/keeper/e2e/harness). No
# secrets, no live RPC: every key is an Anvil well-known development key or
# one minted for the run, and the ops bot is unconfigured, so an alert is
# logged rather than sent.
#
# Scenarios today: the claim-horizon heartbeat (#2517) and the sanctions-hold
# observer (#2515), the latter with the real indexer projecting the chain
# into the shared database it reads; and, on a TWO-chain mesh (a canonical
# node presenting Base Sepolia and a mirror presenting Sepolia, joined by a
# local CCIP lane of real CCIP contracts and a relay, apps/keeper/e2e/mesh),
# the delivery-proof pass (#2516) and its awaiting alert. See
# apps/keeper/e2e/COVERAGE.md.
#
# Modelled on app-e2e.yml's `fork-tier scenarios` job, with its own forge
# cache key (the keeper's seed script is compiled on top of the fixture).
# NOT a required check yet: it is new, and a red here should inform rather
# than block until it has a run history.

name: keeper e2e (anvil)

on:
  pull_request:
    paths:
      - 'apps/keeper/**'
      - 'apps/indexer/**'
      - 'packages/contracts/**'
      - 'packages/lib/**'
      - 'packages/anvil-harness/**'
      - 'contracts/src/**'
      - 'contracts/script/**'
      - 'contracts/test/mocks/**'
      - 'contracts/lib/**'
      - 'contracts/foundry.toml'
      - 'contracts/remappings.txt'
      - '.github/workflows/keeper-e2e.yml'
  push:
    branches: [main]
    paths:
      - 'apps/keeper/**'
      - 'apps/indexer/**'
      - 'packages/contracts/**'
      - 'packages/lib/**'
      - 'packages/anvil-harness/**'
      - 'contracts/src/**'
      - 'contracts/script/**'
      - 'contracts/test/mocks/**'
      - 'contracts/lib/**'
      - 'contracts/foundry.toml'
      - 'contracts/remappings.txt'
      - '.github/workflows/keeper-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keeper-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scenarios:
    name: keeper anvil scenarios
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout (with submodules — the fixture compiles the contracts)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          submodules: recursive

      - name: Install Foundry (forge + anvil)
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: stable

      - name: Snapshot submodule SHAs (for content-based cache key)
        working-directory: contracts
        run: git submodule status --recursive > .submodule-state

      - name: Cache forge artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            contracts/out
            contracts/cache
          key: forge-keeper-e2e-${{ runner.os }}-${{ hashFiles('contracts/foundry.toml', 'contracts/remappings.txt', 'contracts/.submodule-state') }}-${{ hashFiles('contracts/src/**/*.sol', 'contracts/script/**/*.sol', 'contracts/test/mocks/**/*.sol') }}
          restore-keys: |
            forge-keeper-e2e-${{ runner.os }}-${{ hashFiles('contracts/foundry.toml', 'contracts/remappings.txt', 'contracts/.submodule-state') }}-

      # The scripts as their own steps, so compile time and any compile
      # error stay out of the scenarios' log. The global setups compile them
      # again, which is then a cache hit.
      - name: Compile the e2e fixture and the keeper's reward seed (current contracts)
        working-directory: contracts
        env:
          FOUNDRY_PROFILE: default
        run: |
          forge build script/e2e/DeployE2EFixture.s.sol
          forge build script/e2e/ConfigureKeeperRewardsFixture.s.sol

      - name: Compile the two-chain mesh (local CCIP lane, operator-script wrappers, mesh seed)
        working-directory: contracts
        env:
          FOUNDRY_PROFILE: default
        run: |
          forge build script/e2e/DeployE2ELocalCcip.s.sol
          forge build script/e2e/E2EOperatorScripts.s.sol
          forge build script/e2e/ConfigureKeeperMeshFixture.s.sol

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace deps
        run: pnpm install --frozen-lockfile

      - name: Typecheck the keeper (incl. the e2e surface)
        run: pnpm --filter @vaipakam/keeper typecheck

      - name: Run the scenarios
        run: pnpm --filter @vaipakam/keeper run e2e:anvil
