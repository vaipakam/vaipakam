# Docs-drift check — release notes + functional specs.
#
# Non-blocking backstop for two per-PR documentation conventions:
#   - the release-note fragment  (docs/ReleaseNotes/unreleased/)
#   - the statements a behaviour change implements (CanonicalSpecDesign
#     section 15): the merged pull request's description names canonical
#     statement ids (docs/CanonicalSpec/), or says "no behaviour change",
#     or says no canonical section covers what it changes yet
#
# On every push to main, if the merge changed contracts or app code but
# carried no release-note fragment, or its description names no
# statements, emit a warning + job-summary note so the gap is visible in
# the Actions tab. It never fails the run — these are
# disciplines, not merge gates.
#
# It also runs a BLOCKING docs path gate: no operator runbook may cite a
# directory that no longer exists, or link to or show as code a repository
# path the tracked tree does not have. 147 references to the removed
# `frontend/` survived the Stage 3 refactor across 39 documents (#1462), and
# nothing tells the author of a rename which prose mentions the old name — so
# the class is re-checked mechanically rather than by remembering.
#
# It gates at ZERO with no baseline. The operator-facing citations were fixed
# in the same change that added each rule, so a failure is always a NEW one.
# Scope is `docs/ops/`; widening it to the design docs is #1462's completion
# criterion.
#
# The does-it-exist rule (#1486) waited for a real markdown parser and reads
# Markdown through micromark now. Two related rules are still DEFERRED:
# non-canonical `/app/…` URL citations (#1479) and secrets reaching a
# command's argv (#1472). See the admission criterion at the top of
# .github/scripts/check-docs-paths.mjs.
#
# (Filename kept as release-notes-drift.yml for stable references; the
# check now covers functional specs and the mechanical check too.)
name: Docs-drift check (release notes + statements + path gate)

on:
  push:
    branches: [main]
  # NO `paths:` filter (#1467 r3). Any tracked file under any repository root
  # can be the TARGET of a citation, so deleting or renaming one makes a
  # document stale without touching that document — and a filter listing
  # inputs can never enumerate that. An earlier filter listed `docs/**` plus
  # the checker's own files and still missed the commonest case: a PR that
  # removes `contracts/script/Foo.s.sol` while every citation of it sits
  # untouched. The check takes seconds; running it always is cheaper than a
  # filter that is wrong in the direction of silence.
  pull_request:

permissions:
  contents: read
  # Read the merged pull request's description (the statement ids).
  pull-requests: read

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check for release-note + statement updates
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Resolve the diff base. `github.event.before` is all-zeros on a
          # branch's first push / unrelated history — fall back to HEAD^.
          if [ -z "${BEFORE:-}" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            BEFORE="$(git rev-parse HEAD^ 2>/dev/null || echo '')"
          fi
          if [ -z "$BEFORE" ]; then
            echo "No diff base — skipping drift check."
            exit 0
          fi

          # --no-renames: a rename counts at both paths (#2762).
          changed="$(git diff --no-renames --name-only "$BEFORE" "$AFTER")"
          work="$(printf '%s\n' "$changed" | grep -E '^(contracts/src/|apps/)' || true)"
          notes="$(printf '%s\n' "$changed" | grep -E '^docs/ReleaseNotes/' || true)"

          ok=1

          if [ -n "$work" ] && [ -z "$notes" ]; then
            ok=0
            echo "::warning title=Release-notes drift::This merge changed contracts/ or apps/ but added no docs/ReleaseNotes/ fragment. Add one under docs/ReleaseNotes/unreleased/ per the fragment convention."
            {
              echo "### ⚠️ Release-notes drift"
              echo ""
              echo "This merge touched \`contracts/src/\` or \`apps/\` but added no"
              echo "\`docs/ReleaseNotes/\` change. Add a release-note fragment under"
              echo "\`docs/ReleaseNotes/unreleased/\` — see that directory's README."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          # The statements the merge implements (CanonicalSpecDesign section
          # 15). The description is the merged pull request's, read through
          # the API and handled only as data: written to a file, never
          # interpolated into a command.
          if [ -n "$work" ]; then
            body_file="$RUNNER_TEMP/pr-body.md"
            : > "$body_file"
            if ! gh api "repos/$REPO/commits/$AFTER/pulls" --jq '.[0].body // ""' > "$body_file" 2>/dev/null; then
              echo "Could not read the merged pull request's description; the statement check reads it as empty."
            fi
            verdict="$(node .github/scripts/statement-ids.mjs --body "$body_file" --folder docs/CanonicalSpec)"
            kind="$(printf '%s' "$verdict" | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>console.log(JSON.parse(d).verdict))')"
            unknown="$(printf '%s' "$verdict" | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>console.log(JSON.parse(d).unknown.join(" ")))')"
            reserved="$(printf '%s' "$verdict" | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>console.log(JSON.parse(d).reserved))')"
            # A reserved id is reported by count only, never repeated here.
            if [ "$reserved" != "0" ]; then
              ok=0
              echo "::warning title=Reserved statement id::The description carries $reserved id(s) from the reserved range 900 to 999. Public text never carries one; edit the description to remove it."
              {
                echo "### ⚠️ Reserved statement id"
                echo ""
                echo "The description carries $reserved id(s) from the reserved range 900"
                echo "to 999. Public text never carries one, nor says what such a statement"
                echo "covers. Edit the description to remove it."
              } >> "$GITHUB_STEP_SUMMARY"
            fi
            if [ "$kind" = "missing" ]; then
              ok=0
              echo "::warning title=Statements drift::This merge changed contracts/ or apps/ but its description names no canonical statement ids, does not say \"no behaviour change\", and does not say no canonical section covers it. See docs/CanonicalSpec/README.md."
              {
                echo "### ⚠️ Statements drift"
                echo ""
                echo "This merge touched \`contracts/src/\` or \`apps/\`, and its pull request"
                echo "description names no statement it implements. A behaviour change names"
                echo "its statement ids (e.g. a vault statement), or says \"no behaviour change\","
                echo "or says \"no canonical section covers\" what it changes and names the domain looked in — see"
                echo "\`docs/CanonicalSpec/README.md\` and the pull request template."
              } >> "$GITHUB_STEP_SUMMARY"
            fi
            if [ "$kind" = "not-covered-unnamed" ]; then
              ok=0
              echo "::warning title=Statements drift::The description says no canonical section covers this change but names no domain the author looked in (a code such as OFR or LON, on the same line)."
              {
                echo "### ⚠️ Statements drift"
                echo ""
                echo "The description says no canonical section covers this change, but"
                echo "names no domain the author looked in. Write the domain code on the"
                echo "same line (for example \"No canonical section covers this change;"
                echo "looked in OFR\") so a reviewer can check it."
              } >> "$GITHUB_STEP_SUMMARY"
            fi
            if [ -n "$unknown" ]; then
              ok=0
              echo "::warning title=Unknown statement ids::The description names ids no statement in docs/CanonicalSpec/ carries: $unknown"
              {
                echo "### ⚠️ Unknown statement ids"
                echo ""
                echo "The description names ids that no statement heading in"
                echo "\`docs/CanonicalSpec/\` carries: \`$unknown\`."
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

          if [ "$ok" = 1 ]; then
            echo "Docs-drift check OK." >> "$GITHUB_STEP_SUMMARY"
          fi

      # ── Docs path gate ────────────────────────────────────────────────
      #
      # BLOCKING, unlike the release-note/functional-spec warnings above.
      # It can be, because it gates at ZERO: the operator runbooks it covers
      # were cleaned in the same change that added it, so a failure always
      # means a NEW stale citation rather than an old one.
      #
      # There is no baseline and no ratchet. Earlier revisions had both,
      # solely because the check was red on arrival; the platform is pre-live,
      # so the ~45 operator-facing citations were fixed instead of frozen.
      #
      # Scope: every citation in `docs/ops/`, where a stale path costs a
      # person real time, and every LINK in the other living docs (#3548).
      # Shipped release notes and `docs/OlderDocs/` are history and are not
      # rewritten. The script's header has the reasoning.
      #
      # Two rules: a citation of a REMOVED directory (closed-world, may read
      # the words inside command text) and a cited path that DOES NOT EXIST
      # (open-world, #1486, reads only whole links and code spans as a
      # CommonMark parser finds them). The parser is micromark, which lives in
      # `@vaipakam/lib` with the excision gate's parsers, so this job installs
      # that one package's dependencies, and nothing else, before either gate.
      - name: Install pnpm (markdown gate parsers)
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js (markdown gate parsers)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install the markdown gates' parsers
        run: pnpm install --frozen-lockfile --filter @vaipakam/lib

      - name: Docs path gate (removed directories, cited paths and links exist)
        run: |
          set -euo pipefail
          # Fixtures first, as for the other gates: each pins a case #1467's
          # review found wrong, and a suite that never runs is decoration.
          node .github/scripts/check-docs-paths.selftest.mjs
          node .github/scripts/check-docs-paths.mjs
          echo "Docs path gate + selftest OK." >> "$GITHUB_STEP_SUMMARY"

      # Cron-slot gate (#1977). Same shape and the same reason as the two
      # gates around it: a fact about live infrastructure gets copied into
      # prose, and prose has no compiler. This one bans RESTATING how many of
      # the account's 5 cron triggers are spoken for, because every copy of
      # that count agreed with the others and they were wrong together — none
      # of them could see a Worker that has no source in this tree. (How many
      # copies is enumerated in the release-note fragment; restating the
      # number here is the same defect this step bans, and an earlier revision
      # of this comment said "seven" while the authority said ten.)
      #
      # Offline only. The `--live` half diffs the committed inventory against
      # the Cloudflare account, and CI has no account credentials; an operator
      # runs it from `docs/ops/CloudflareCronSlots.md`. So a green step here
      # means "nobody re-copied the count", NOT "the inventory is current" —
      # two different claims, and only the first is checkable without a token.
      #
      # Fixtures first, for the reason the excision selftest gives: the rule's
      # value is the line it draws between the CAP (allowed — the replacement
      # sentence needs it) and the OCCUPANCY (banned), and a line drawn in
      # regexes is not self-evident from reading them.
      - name: Cron-slot gate (restated trigger occupancy)
        run: |
          set -euo pipefail
          node .github/scripts/check-cron-slots.mjs --selftest
          node .github/scripts/check-cron-slots.mjs
          echo "Cron-slot gate + selftest OK." >> "$GITHUB_STEP_SUMMARY"

      # The reader the statement check above uses on main (section 15 of
      # CanonicalSpecDesign). Its fixtures run on every pull request, so a
      # change to the reader is checked before it decides a merge's warning.
      - name: Statement id reader (selftest)
        run: |
          set -euo pipefail
          node .github/scripts/statement-ids.mjs --selftest
          echo "Statement id reader selftest OK." >> "$GITHUB_STEP_SUMMARY"

      # Release-note assembler tests. The assembler decides which pending
      # fragments belong to the day being assembled, and gets that decision
      # from git history — both halves fail SILENTLY when wrong, producing a
      # plausible-looking notes file rather than an error. Two such failures
      # have already shipped (#1769, #1783), so the cases are asserted rather
      # than eyeballed.
      #
      # Blocking, and unconditional rather than path-filtered: the suite runs
      # in about two seconds against throwaway repositories it builds itself,
      # and it depends on git behaviour (`--diff-filter=A`, shallow-boundary
      # attribution) that can change underneath an untouched script.
      - name: Release-note assembler tests
        run: |
          set -euo pipefail
          bash docs/ReleaseNotes/assemble.test.sh
          echo "Release-note assembler tests OK." >> "$GITHUB_STEP_SUMMARY"

      # Excision ratchet (#1651). Same shape and the same reason as the gate
      # above — a removed thing keeps being described as live, and prose has
      # no compiler. This one pins a COUNT per file rather than banning a
      # name, because the retraction notes doing the cleanup necessarily name
      # what they retract; a ban would fight its own remediation.
      #
      # Blocking, deliberately. #687-A removed that surface for legal
      # reasons, so new text presenting it as live is not a style nit.
      #
      # It reads Markdown through micromark and the parse5 tokenizer (#1732,
      # #1758), installed with the docs path gate's parsers above.
      - name: Excision residue gate (#687-A VPFI buy surface)
        run: |
          set -euo pipefail
          # Regression fixtures FIRST. Scanning the committed suite as ordinary
          # pinned text does not execute it, so without this line a later change
          # could re-break a Markdown case (or widen the prose-only scope) and still pass here,
          # provided the current tree happened not to contain that construct.
          # A suite that never runs is decoration.
          node .github/scripts/check-excision-residue.selftest.mjs
          node .github/scripts/check-excision-residue.mjs
          echo "Excision residue gate + selftest OK." >> "$GITHUB_STEP_SUMMARY"
