# Docs-drift check — release notes + functional specs.
#
# Non-blocking backstop for two per-PR documentation conventions:
#   - the release-note fragment  (docs/ReleaseNotes/unreleased/)
#   - the functional-spec update (docs/FunctionalSpecs/)
#
# On every push to main, if the merge changed contracts or app code but
# touched neither doc family, emit a warning + job-summary note so the
# gap is visible in the Actions tab. It never fails the run — these are
# disciplines, not merge gates.
#
# It also runs a BLOCKING docs path gate: no operator runbook may cite a
# directory that no longer exists. 147 references to the removed `frontend/`
# survived the Stage 3 refactor across 39 documents (#1462), and nothing tells
# the author of a rename which prose mentions the old name — so the class is
# re-checked mechanically rather than by remembering.
#
# It gates at ZERO with no baseline. The operator-facing citations were fixed
# in the same change that added it, so a failure is always a NEW one. Scope is
# `docs/ops/`; widening it to the design docs is #1462's completion criterion.
#
# Three related rules were built alongside it and DEFERRED, all for one
# reason — each needs a precise markdown extractor, which means a real parser:
# does-it-exist against the tracked tree (#1486), non-canonical `/app/…` URL
# citations (#1479), and secrets reaching a command's argv (#1472). See the
# admission criterion at the top of .github/scripts/check-docs-paths.mjs.
#
# (Filename kept as release-notes-drift.yml for stable references; the
# check now covers functional specs and the mechanical check too.)
name: Docs-drift check (release notes + functional specs + path gate)

on:
  push:
    branches: [main]
  # NO `paths:` filter (#1467 r3). Any tracked file under any repository root
  # can be the TARGET of a citation, so deleting or renaming one makes a
  # document stale without touching that document — and a filter listing
  # inputs can never enumerate that. An earlier filter listed `docs/**` plus
  # the checker's own files and still missed the commonest case: a PR that
  # removes `contracts/script/Foo.s.sol` while every citation of it sits
  # untouched. The check takes seconds; running it always is cheaper than a
  # filter that is wrong in the direction of silence.
  pull_request:

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Check for release-note + functional-spec updates
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail

          # Resolve the diff base. `github.event.before` is all-zeros on a
          # branch's first push / unrelated history — fall back to HEAD^.
          if [ -z "${BEFORE:-}" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            BEFORE="$(git rev-parse HEAD^ 2>/dev/null || echo '')"
          fi
          if [ -z "$BEFORE" ]; then
            echo "No diff base — skipping drift check."
            exit 0
          fi

          changed="$(git diff --name-only "$BEFORE" "$AFTER")"
          work="$(printf '%s\n' "$changed" | grep -E '^(contracts/src/|apps/)' || true)"
          notes="$(printf '%s\n' "$changed" | grep -E '^docs/ReleaseNotes/' || true)"
          specs="$(printf '%s\n' "$changed" | grep -E '^docs/FunctionalSpecs/' || true)"

          ok=1

          if [ -n "$work" ] && [ -z "$notes" ]; then
            ok=0
            echo "::warning title=Release-notes drift::This merge changed contracts/ or apps/ but added no docs/ReleaseNotes/ fragment. Add one under docs/ReleaseNotes/unreleased/ per the fragment convention."
            {
              echo "### ⚠️ Release-notes drift"
              echo ""
              echo "This merge touched \`contracts/src/\` or \`apps/\` but added no"
              echo "\`docs/ReleaseNotes/\` change. Add a release-note fragment under"
              echo "\`docs/ReleaseNotes/unreleased/\` — see that directory's README."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ -n "$work" ] && [ -z "$specs" ]; then
            ok=0
            echo "::warning title=Functional-specs drift::This merge changed contracts/ or apps/ but touched no docs/FunctionalSpecs/ doc. Update the relevant domain spec to the new behaviour — see docs/FunctionalSpecs/README.md."
            {
              echo "### ⚠️ Functional-specs drift"
              echo ""
              echo "This merge touched \`contracts/src/\` or \`apps/\` but updated no"
              echo "\`docs/FunctionalSpecs/\` doc. Rewrite the affected domain spec to"
              echo "the new current-state behaviour — see \`docs/FunctionalSpecs/README.md\`."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "$ok" = 1 ]; then
            echo "Docs-drift check OK." >> "$GITHUB_STEP_SUMMARY"
          fi

      # ── Docs path gate ────────────────────────────────────────────────
      #
      # BLOCKING, unlike the release-note/functional-spec warnings above.
      # It can be, because it gates at ZERO: the operator runbooks it covers
      # were cleaned in the same change that added it, so a failure always
      # means a NEW stale citation rather than an old one.
      #
      # There is no baseline and no ratchet. Earlier revisions had both,
      # solely because the check was red on arrival; the platform is pre-live,
      # so the ~45 operator-facing citations were fixed instead of frozen.
      #
      # Scope is `docs/ops/` — where a stale path costs a person real time and
      # where the cleanup has actually happened. Widening it to the design
      # docs is #1462's completion criterion, not a knob to turn here.
      #
      # No `setup-node`: `ubuntu-latest` ships a current Node and the scripts
      # use only ESM + `node:fs`/`node:child_process`. Avoiding the action also
      # avoids the allowlist hazard — a `uses:` whose exact SHA is not
      # allowlisted fails the WHOLE workflow at startup, not just the step.
      - name: Docs path gate (removed-directory citations)
        run: |
          set -euo pipefail
          node .github/scripts/check-docs-paths.mjs
          echo "Docs path gate OK." >> "$GITHUB_STEP_SUMMARY"

      # Cron-slot gate (#1977). Same shape and the same reason as the two
      # gates around it: a fact about live infrastructure gets copied into
      # prose, and prose has no compiler. This one bans RESTATING how many of
      # the account's 5 cron triggers are spoken for, because every copy of
      # that count agreed with the others and they were wrong together — none
      # of them could see a Worker that has no source in this tree. (How many
      # copies is enumerated in the release-note fragment; restating the
      # number here is the same defect this step bans, and an earlier revision
      # of this comment said "seven" while the authority said ten.)
      #
      # Offline only. The `--live` half diffs the committed inventory against
      # the Cloudflare account, and CI has no account credentials; an operator
      # runs it from `docs/ops/CloudflareCronSlots.md`. So a green step here
      # means "nobody re-copied the count", NOT "the inventory is current" —
      # two different claims, and only the first is checkable without a token.
      #
      # Fixtures first, for the reason the excision selftest gives: the rule's
      # value is the line it draws between the CAP (allowed — the replacement
      # sentence needs it) and the OCCUPANCY (banned), and a line drawn in
      # regexes is not self-evident from reading them.
      - name: Cron-slot gate (restated trigger occupancy)
        run: |
          set -euo pipefail
          node .github/scripts/check-cron-slots.mjs --selftest
          node .github/scripts/check-cron-slots.mjs
          echo "Cron-slot gate + selftest OK." >> "$GITHUB_STEP_SUMMARY"

      # Release-note assembler tests. The assembler decides which pending
      # fragments belong to the day being assembled, and gets that decision
      # from git history — both halves fail SILENTLY when wrong, producing a
      # plausible-looking notes file rather than an error. Two such failures
      # have already shipped (#1769, #1783), so the cases are asserted rather
      # than eyeballed.
      #
      # Blocking, and unconditional rather than path-filtered: the suite runs
      # in about two seconds against throwaway repositories it builds itself,
      # and it depends on git behaviour (`--diff-filter=A`, shallow-boundary
      # attribution) that can change underneath an untouched script.
      - name: Release-note assembler tests
        run: |
          set -euo pipefail
          bash docs/ReleaseNotes/assemble.test.sh
          echo "Release-note assembler tests OK." >> "$GITHUB_STEP_SUMMARY"

      # Excision ratchet (#1651). Same shape and the same reason as the gate
      # above — a removed thing keeps being described as live, and prose has
      # no compiler. This one pins a COUNT per file rather than banning a
      # name, because the retraction notes doing the cleanup necessarily name
      # what they retract; a ban would fight its own remediation.
      #
      # Blocking, deliberately. #687-A removed that surface for legal
      # reasons, so new text presenting it as live is not a style nit.
      - name: Excision residue gate (#687-A VPFI buy surface)
        run: |
          set -euo pipefail
          # Regression fixtures FIRST. Scanning the committed suite as ordinary
          # pinned text does not execute it, so without this line a later change
          # could re-break a markup / JSON / PDF case and still pass here,
          # provided the current tree happened not to contain that construct.
          # A suite that never runs is decoration.
          node .github/scripts/check-excision-residue.selftest.mjs
          node .github/scripts/check-excision-residue.mjs
          echo "Excision residue gate + selftest OK." >> "$GITHUB_STEP_SUMMARY"
