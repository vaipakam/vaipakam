# Docs-drift check — release notes + functional specs.
#
# Non-blocking backstop for two per-PR documentation conventions:
#   - the release-note fragment  (docs/ReleaseNotes/unreleased/)
#   - the functional-spec update (docs/FunctionalSpecs/)
#
# On every push to main, if the merge changed contracts or app code but
# touched neither doc family, emit a warning + job-summary note so the
# gap is visible in the Actions tab. It never fails the run — these are
# disciplines, not merge gates.
#
# It also runs one MECHANICAL docs check, added because the same stale-path
# defect kept surfacing in a different document each review round — 147
# references to the removed `frontend/` directory across 39 documents (#1462).
# The class is not preventable by discipline (nothing tells the author of a
# rename which prose mentions the old name), so it is re-checked here on every
# push and PR:
#
#   - check-docs-paths.mjs — cited repo paths resolve, and no document cites a
#     directory that was removed or renamed.
#
# TWO companion checks were built alongside it and DEFERRED rather than
# shipped, both for the same reason — a check that is sometimes wrong teaches
# people to ignore the one that never is:
#
#   - secrets reaching a command's argv (#1472): deciding it correctly needs
#     real shell parsing, and each review round found another case the
#     approximation got wrong, including flagging the pattern the docs
#     recommend.
#   - non-canonical `/app/...` URL citations (#1479): four rounds, each closing
#     a real gap and the next finding another citation form the pattern
#     mishandled. Citation forms are an unbounded set; what shipped is a
#     set-membership test, which is decidable.
#
# It RATCHETS against a committed baseline: it fails only when a file GAINS
# findings, so the existing backlog (#1462) is frozen rather than blocking, and
# a check that is red on day one cannot become one that gets muted. See
# .github/scripts/docs-check-ratchet.mjs for why per-file and directional.
#
# (Filename kept as release-notes-drift.yml for stable references; the
# check now covers functional specs and the mechanical check too.)
name: Docs-drift check (release notes + functional specs + stale paths)

on:
  push:
    branches: [main]
  # NO `paths:` filter (#1467 r3). Any tracked file under any repository root
  # can be the TARGET of a citation, so deleting or renaming one makes a
  # document stale without touching that document — and a filter listing
  # inputs can never enumerate that. An earlier filter listed `docs/**` plus
  # the checker's own files and still missed the commonest case: a PR that
  # removes `contracts/script/Foo.s.sol` while every citation of it sits
  # untouched. The check takes seconds; running it always is cheaper than a
  # filter that is wrong in the direction of silence.
  pull_request:

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Check for release-note + functional-spec updates
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail

          # Resolve the diff base. `github.event.before` is all-zeros on a
          # branch's first push / unrelated history — fall back to HEAD^.
          if [ -z "${BEFORE:-}" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            BEFORE="$(git rev-parse HEAD^ 2>/dev/null || echo '')"
          fi
          if [ -z "$BEFORE" ]; then
            echo "No diff base — skipping drift check."
            exit 0
          fi

          changed="$(git diff --name-only "$BEFORE" "$AFTER")"
          work="$(printf '%s\n' "$changed" | grep -E '^(contracts/src/|apps/)' || true)"
          notes="$(printf '%s\n' "$changed" | grep -E '^docs/ReleaseNotes/' || true)"
          specs="$(printf '%s\n' "$changed" | grep -E '^docs/FunctionalSpecs/' || true)"

          ok=1

          if [ -n "$work" ] && [ -z "$notes" ]; then
            ok=0
            echo "::warning title=Release-notes drift::This merge changed contracts/ or apps/ but added no docs/ReleaseNotes/ fragment. Add one under docs/ReleaseNotes/unreleased/ per the fragment convention."
            {
              echo "### ⚠️ Release-notes drift"
              echo ""
              echo "This merge touched \`contracts/src/\` or \`apps/\` but added no"
              echo "\`docs/ReleaseNotes/\` change. Add a release-note fragment under"
              echo "\`docs/ReleaseNotes/unreleased/\` — see that directory's README."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ -n "$work" ] && [ -z "$specs" ]; then
            ok=0
            echo "::warning title=Functional-specs drift::This merge changed contracts/ or apps/ but touched no docs/FunctionalSpecs/ doc. Update the relevant domain spec to the new behaviour — see docs/FunctionalSpecs/README.md."
            {
              echo "### ⚠️ Functional-specs drift"
              echo ""
              echo "This merge touched \`contracts/src/\` or \`apps/\` but updated no"
              echo "\`docs/FunctionalSpecs/\` doc. Rewrite the affected domain spec to"
              echo "the new current-state behaviour — see \`docs/FunctionalSpecs/README.md\`."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "$ok" = 1 ]; then
            echo "Docs-drift check OK." >> "$GITHUB_STEP_SUMMARY"
          fi

      # ── Mechanical docs checks (ratcheted) ────────────────────────────
      #
      # NON-BLOCKING, matching this workflow's existing philosophy: the step
      # reports and never fails the run. That is a deliberate limitation
      # rather than an oversight — a warning does not stop a new instance
      # merging, so the class is observed rather than closed.
      #
      # TO MAKE IT A GATE: delete the `exit 0` at the END of this step. The
      # scripts already exit non-zero on a regression; only the step
      # swallows it. Owner-approved as the intended end state — the trigger
      # conditions and the one legitimate-exception rule are on **#1468**.
      #
      # Keep it a RATCHET when gating. Gating on a zero TOTAL would demand
      # rewriting historical records (closed `docs/ToDo.md` entries, past
      # design docs), which falsifies them — see #1462.
      # No `setup-node`: `ubuntu-latest` ships a current Node, and these
      # scripts use only ESM + `node:fs`/`node:child_process`. Avoiding the
      # action also avoids the allowlist hazard — a `uses:` whose exact SHA
      # is not allowlisted fails the WHOLE workflow at startup, not just the
      # step, and this repo pins a different setup-node SHA elsewhere.
      - name: Mechanical docs checks (stale paths)
        env:
          # The revision the ratchet polices its baseline against. `before` on
          # a push; the PR's own base branch otherwise — never a hardcoded
          # `main`, which on a push to main compares the baseline with itself.
          DOCS_CHECK_BASE_REF: >-
            ${{ github.event_name == 'push'
                && github.event.before
                || format('origin/{0}', github.base_ref) }}
        run: |
          set -uo pipefail
          fail=0
          for check in check-docs-paths; do
            echo "::group::$check"
            if node ".github/scripts/$check.mjs"; then
              echo "$check: OK"
            else
              fail=1
              echo "::warning title=$check::A docs file GAINED findings — see the job log. Fix it, or if the finding is deliberate, explain it in the PR."
              {
                echo "### ⚠️ $check"
                echo ""
                echo "A \`docs/\` file gained findings against the committed"
                echo "baseline. Fix the citation, or — if the reference is"
                echo "deliberately historical — move it under a skipped"
                echo "directory."
                echo ""
                echo "Do **not** raise the baseline to silence it. A raised"
                echo "baseline records that something is permitted without"
                echo "recording why, which makes a real exception"
                echo "indistinguishable from a regression — and the growth"
                echo "guard rejects it anyway. A genuine exception belongs in"
                echo "an allowlist entry with a stated reason (the shape"
                echo "\`check-event-coverage.mjs\` uses); see #1468."
              } >> "$GITHUB_STEP_SUMMARY"
            fi
            echo "::endgroup::"
          done
          [ "$fail" = 0 ] && echo "Mechanical docs checks OK." >> "$GITHUB_STEP_SUMMARY"
          # Non-blocking by design — see the comment at the top of this
          # step, and #1468 for when and how to remove this line.
          exit 0
