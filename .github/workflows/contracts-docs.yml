# Contracts documentation site — auto-generated NatSpec docs published
# to GitHub Pages on push to `main`.
#
# Why this exists:
# - Auditors browsing the protocol can read the per-function NatSpec
#   in a navigable form without cloning + running `forge doc` locally.
# - Ecosystem integrators (keeper-bot authors, indexer authors) get a
#   discoverable API surface for every facet.
# - The site is built directly from the source — no risk of drift
#   between "what the docs say" and "what the contract does", since
#   NatSpec lives next to the code.
#
# Site URL: https://vaipakam.github.io/vaipakam/
#
# Trigger discipline (post Issue #169 fold):
# - `main` push: rebuilds + deploys.
# - `workflow_dispatch`: manual rebuild + deploy (cache-bust / recovery).
# - PRs: NO LONGER triggered here. The `build-docs` job in `ci.yml`
#   handles PR-preview rendering, downstream of `contracts-fast` for
#   ORDERING (a broken contracts build short-circuits the doc job
#   instead of racing it). Post-#1493 the doc build is a separate,
#   self-contained quick-profile solc pass (~2 min) — serialized after
#   contracts-fast's cifast compile, not sharing it. This file now owns
#   ONLY the Pages-deploy concern on push-to-main.

name: Contracts docs

on:
  push:
    branches: [main]
  workflow_dispatch:

# Concurrency scoping:
# Push-to-main / workflow_dispatch deploys share the `pages-deploy`
# group so the Pages site never has overlapping deploys. PR-preview
# builds moved to ci.yml and use the cancel-in-progress on the parent
# `ci-${{ github.ref }}-pull_request` group, so they don't fight here.
concurrency:
  group: contracts-docs-pages-deploy
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    # forge doc runs self-contained under the `quick` profile (#1493):
    # src-only solc pass + mdbook render, ~2 min / ~1.5 GB measured.
    # No forge cache — the doc build never read one, and sharing the
    # profile-agnostic key with ci.yml's cifast jobs risked starving
    # them (exact-key cache entries are immutable, first save wins).
    # Cap kept generous for slow runners.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@c7450ba673e133f5ee30098b3b54f444d3a2ca2d # v1

      # The "Restore foundry cache" step that sat here was REMOVED in
      # #1493: `forge doc` runs its own solc pass and never read the
      # shared forge cache — and worse, this now-fast quick-profile job
      # could SAVE the profile-agnostic `forge-<os>-<hash>` key first
      # (exact-key cache entries are immutable), starving ci.yml's
      # cifast jobs of their complete cache. The doc build is
      # self-contained.
      - name: Forge doc --build
        # Builds an mdbook tree under `contracts/docs/book` from the
        # per-function NatSpec comments in `contracts/src/`. The
        # rendered-site configuration comes from `foundry.toml [doc]`;
        # the ONE load-bearing CI-side setting is the FOUNDRY_PROFILE
        # override below, which controls the compiler scope.
        #
        # QUICK profile, same as ci.yml's Build docs (#1493): forge doc
        # runs its own solc pass over the ACTIVE profile's source glob
        # (it does not reuse cached out/), and the default profile's
        # test-inclusive unit exceeds the 16 GB runner ceiling — the
        # OOM killer takes the runner down after ~29 silent minutes.
        # quick's test/** + script/** skip globs keep the doc compile
        # src-only (~2 min / ~1.5 GB), which is the scope the site
        # documents anyway.
        env:
          FOUNDRY_PROFILE: quick
        run: |
          cd contracts
          forge doc --build

      - name: Drop CONTEXT.md breadcrumb at site root
        # GitHub Pages serves the artifact's root as the site root.
        # `forge doc` writes into `contracts/docs/book`; we publish
        # that directory.
        #
        # The WIP banner that used to live here was retired alongside
        # issue #181 (LayerZero → CCIP NatSpec scrub merged in PR #190
        # on 2026-05-22). The breadcrumb stays — direct visitors to
        # /CONTEXT.md and anyone browsing the artifact tree should
        # still find pointers to the protocol-level docs.
        run: |
          set -euo pipefail
          if [[ ! -d contracts/docs/book ]]; then
            echo "::error::forge doc did not produce contracts/docs/book"
            ls -la contracts/docs/ 2>/dev/null || true
            exit 1
          fi

          cat > contracts/docs/book/CONTEXT.md <<'EOF'
          # Vaipakam Contracts — auto-generated API docs

          Generated by `forge doc` from per-function NatSpec in
          `contracts/src/`. For protocol-level docs, read:

          - [Repository root](https://github.com/vaipakam/vaipakam)
          - [Operator handbook](https://github.com/vaipakam/vaipakam/blob/main/docs/internal/ProjectProcedures.md)
          - [Architecture Decision Records](https://github.com/vaipakam/vaipakam/tree/main/docs/adr)
          - [Glossary](https://github.com/vaipakam/vaipakam/blob/main/docs/GLOSSARY.md)
          - [Functional specs](https://github.com/vaipakam/vaipakam/tree/main/docs/FunctionalSpecs)
          EOF
          echo "CONTEXT.md breadcrumb written."

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: contracts/docs/book

      # NOTE: the PR-preview artifact upload path moved to ci.yml's
      # `build-docs` job (Issue #169). This workflow now only handles
      # push-to-main deploys, so no PR-event branches remain.

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
