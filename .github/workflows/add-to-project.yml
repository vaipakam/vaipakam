name: Add new issues to @vaipakam-labs project

# Workaround for the GitHub Projects v2 Auto-add UI workflow's
# single-repo-per-rule limitation (see
# https://github.com/orgs/community/discussions/47803). This Action
# runs in every repo that should feed the central project; the
# combined effect is "auto-add issues from any of the linked repos
# into @vaipakam-labs as Backlog".
#
# Cross-account write (issues live in `vaipakam/vaipakam`, project
# lives under the `vaipakam` user account — same login, but the
# default GITHUB_TOKEN can't cross the repo→user-project boundary)
# requires a PAT with `project` scope, stored as the
# `ADD_TO_PROJECT_PAT` repository secret.

on:
  issues:
    types:
      - opened
      - reopened
      - transferred

# Least-privilege at the workflow level — the Action overrides
# with the PAT for the actual write, but the workflow's own token
# stays read-only to limit blast radius.
permissions:
  contents: read

jobs:
  add-to-project:
    name: Add issue to @vaipakam-labs
    # An `issues` event always runs main's copy of this file, so the ref
    # check holds for every real run.
    if: github.ref == 'refs/heads/main'
    # #3541: this job reads secrets. They live in the `main-only` environment,
    # whose deployment-branch rule admits only main, so a run of a pushed
    # branch's copy of this file receives none of them; the ref check says the
    # same thing in the file, for a reader.
    environment: main-only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/add-to-project@f2c1f1fa649a891be84948ea89b5dfba1526ef05 # v2.0.1
        with:
          project-url: https://github.com/users/vaipakam/projects/1
          github-token: ${{ secrets.ADD_TO_PROJECT_PAT }}
