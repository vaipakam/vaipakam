name: Indexer ingest health

# WHY THIS EXISTS (#2469). A stalled indexer ingest is silent: when a build
# was published ahead of migration 0056, the schema gate declined every
# scheduled tick by name, in the Worker's logs, and the stall was found by a
# stale screen. This probe reads the indexer's own `GET /health/ingest` from
# outside the Worker every 15 minutes and FAILS when a watched chain's ingest
# has stopped, when the schema gate is waiting on a migration (naming it),
# when the indexer has recorded a loan-status announcement that disagrees
# with the status diagram (#2337 — the check the retired reference subgraph
# used to count, now in the indexer, and now paged on), or when the route
# cannot be read.
#
# HOW THE OPERATOR HEARS OF IT. Not from the failed run alone: GitHub sends
# scheduled-workflow notifications only to the account that last edited the
# cron line, and only if that account has Actions notifications on, so a red
# run is not an alert anyone is guaranteed to receive (#2482 r1). The probe
# therefore OPENS AN ISSUE — titled "Indexer not healthy", labelled
# `infra`, assigned to the `alert` job's assignee — on the first failing run, adds
# nothing while the same condition lasts — a CHANGED condition (another chain
# stalls, the gate goes pending) is commented and notified again — and closes
# it with a comment on the first healthy run. An issue assignment notifies by the assignee's own settings, and
# the issue reaches the board through project-board-reconcile.yml's sweep (an
# issue opened with GITHUB_TOKEN does not trigger add-to-project.yml). That
# issue is also the alert STATE: the optional Telegram post (alert-issue.yml) goes out
# only when it is opened or its condition changes.
#
# Why a workflow and not a Worker: every Cloudflare cron trigger on the
# account is spoken for (docs/ops/CloudflareCronSlots.md), and a watcher
# inside the indexer could not report the indexer's own crash.
#
# GitHub runs scheduled workflows on a best-effort schedule, so a check can
# start late at busy times. The STALENESS itself is measured by the indexer
# against its own cursor, so a late run judges the same facts.
#
# The judging rules and their fixtures live in
# .github/scripts/check-ingest-health.mjs (`--selftest`).

on:
  schedule:
    - cron: '7,22,37,52 * * * *' # every 15 min, off the hour marks
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/scripts/check-ingest-health.mjs'
      - '.github/workflows/ingest-health.yml'
      - '.github/workflows/alert-issue.yml'

permissions:
  contents: read # the alert job adds issues: write for itself

# Probes and PR selftests in SEPARATE groups (#2482 r1): a concurrency group
# keeps one pending run and replaces it with the next one queued, so a shared
# group would let PR activity displace a pending production probe.
concurrency:
  group: ingest-health-${{ github.event_name == 'pull_request' && 'selftest' || 'probe' }}
  cancel-in-progress: false

jobs:
  selftest:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: node .github/scripts/check-ingest-health.mjs --selftest

  probe:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # The job's own limit, well under GitHub's: the checker's fetch is capped
    # at 20 s, so a probe that runs this long is hung, and the separate
    # `alert` job below still runs after it is cancelled (#2482 r5).
    timeout-minutes: 4
    outputs:
      verdict: ${{ steps.check.outcome }}
      problems: ${{ steps.check.outputs.problems }}
      keys: ${{ steps.check.outputs.keys }}
    env:
      INDEXER_ORIGIN: https://indexer.vaipakam.com
      # WHICH CHAINS: the probe watches the set the indexer reports it is
      # configured to scan (`configured.chains` on /health/ingest — a
      # deployment artifact and an RPC binding present), so a chain activated
      # or restored there is watched with no edit here (#2498). A chain the
      # indexer no longer scans (Sepolia has no deployment in the bundle)
      # drops out of that set by itself. This is the explicit opt-out for a
      # chain that is configured but intentionally idle: comma-separated chain
      # ids, empty for none.
      INGEST_IDLE_CHAINS: ''
      # The indexer's cron runs every minute and a healthy cursor is ~1–2 min
      # old; 15 min of standing still is a stall, not a slow tick.
      INGEST_STALE_SECONDS: '900'
      # #2337 — loan-status violations an operator has investigated, as
      # `chainId:txHash:logIndex`, comma-separated. A recorded violation stays
      # recorded on the indexer; listing it here, in a reviewed commit, is what
      # stops the page. Empty: every recorded violation pages.
      LIFECYCLE_ACKNOWLEDGED: ''
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - id: check
        run: node .github/scripts/check-ingest-health.mjs
      # The run summary says "not healthy" only for a VERDICT; a run that
      # failed before one says the probe failed and ingest is unknown
      # (#2482 r5).
      - name: Summary
        if: failure()
        env:
          VERDICT: ${{ steps.check.outcome }}
          PROBLEMS: ${{ steps.check.outputs.problems }}
        run: |
          if [ "$VERDICT" = "failure" ] && [ -n "$PROBLEMS" ]; then
            {
              echo "## The indexer is NOT healthy"
              echo
              printf '%s\n' "$PROBLEMS" | sed 's/^/- /'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## The ingest probe failed before it could judge ingest"
              echo
              echo "Ingest itself is UNKNOWN (checker step: ${VERDICT:-not run}). See the log above."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  # Notification lives in its OWN job (#2482 r5): it runs after the probe
  # whatever happened to it — failed, timed out, cancelled — so a hung probe
  # cannot take the operator's alert down with it. The alert path itself (the
  # issue lifecycle, the forged-marker guard, the Telegram fallback) is the
  # shared alert-issue.yml (#2242), which the deploy-lag check uses too.
  alert:
    needs: probe
    if: always() && github.event_name != 'pull_request'
    permissions:
      issues: write
    uses: ./.github/workflows/alert-issue.yml
    with:
      probe-result: ${{ needs.probe.result }}
      verdict: ${{ needs.probe.outputs.verdict }}
      problems: ${{ needs.probe.outputs.problems }}
      # The stable condition (no ages): what tells a continuing stall from a
      # changed one (#2482 r3).
      keys: ${{ needs.probe.outputs.keys }}
      # Who the alert issue is assigned to — the operator who acts on it.
      assignee: vaipakam
      # Every verdict the probe can reach — a stalled chain, a pending
      # migration, a loan-status violation — shares this one issue; its body
      # names which.
      unhealthy-title: Indexer not healthy
      unhealthy-intro: 'The scheduled ingest probe found the indexer is not healthy:'
      unhealthy-headline: The indexer is NOT healthy
      healthy-comment: The indexer is healthy again
      # A run that failed WITHOUT a verdict (checkout, setup, the checker's
      # own configuration, a timeout) says nothing about ingest; it gets its
      # own issue so the operator is never told ingest is stalled when its
      # state is unknown (#2482 r2).
      broken-title: Indexer ingest probe not running
      broken-body: The scheduled ingest probe failed before it could judge ingest. Ingest itself is UNKNOWN, not known to be stalled — the run log says what broke.
      broken-headline: The indexer ingest probe failed before it could judge ingest (state unknown)
      footer: This issue closes itself on recovery. See .github/workflows/ingest-health.yml (#2469).
      # The marker existing open issues already carry, so an issue opened
      # before the move keeps its recorded condition.
      marker: ingest-keys
    secrets:
      TG_OPS_BOT_TOKEN: ${{ secrets.TG_OPS_BOT_TOKEN }}
      TG_OPS_CHAT_ID: ${{ secrets.TG_OPS_CHAT_ID }}
