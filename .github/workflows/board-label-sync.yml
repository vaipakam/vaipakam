name: Mirror labels onto the Thread, Priority and Stage issue fields, and fill the date fields

# WHY THIS EXISTS. Labels are the source of truth for an issue's priority,
# stage and owning thread (owner decision 2026-11-22): project agents can set a
# label. This job makes the issue fields follow: `priority:p1`…`priority:p5` →
# the `Priority` issue field, `stage:<name>` → `Stage`, `thread:<name>` →
# `Thread`. These are ISSUE fields defined for the repository's owner, not
# project fields: the value lives on the issue, and the `@vaipakam-labs` board
# views group by it. The direction is one way; nothing here ever reads a field
# to change a label.
#
# THE TWO DATES (owner rules 2026-11-22). The same job fills the DATE issue
# fields `Start date` and `Target date` on every issue AND pull request, open
# or closed — the only fields it writes on a closed issue or a pull request:
#   - Start date: a pull request's `created_at`; an issue's earliest of the
#     `created_at` of a pull request linked to it (a cross-reference from a PR,
#     which a closing PR also makes) and the first `stage:building` label,
#     else the issue's own `created_at`. Read from the issue's timeline, and
#     only while the issue still needs it (see the cost note below).
#   - Target date: a closed item's `closed_at` (a merged PR's merge). An open
#     item never gets one invented, and a value set by hand stays; a reopened
#     item loses it only when it equals the day the item was last closed — a
#     value this job wrote.
# All dates are the UTC day, YYYY-MM-DD. The rules live in `DATE_FIELDS`,
# `timelineFacts`, `timelineReason` and `planWrites` in the script.
#
# The rules — fields matched BY NAME at run time, never by id; single-select
# options (Priority, Stage) matched case-insensitively and written under the
# option's own name; Thread, a text field, written as the label suffix has it;
# the date fields matched the same way, trimmed and case-insensitively (so
# `Start Date` and `Start date` both resolve), and only when their type is DATE;
# a missing field or option reported in the job summary as something to add
# and its writes skipped; two labels of one family writing nothing; an absent
# label clearing only a value this job would itself have written (for Thread,
# only a value that is one of the repository's own `thread:` suffixes); the
# label families written only on this repository's open issues — live in
# `.github/scripts/board-label-sync.mjs` (`planWrites`) and are pinned by
# `board-label-sync.selftest.mjs`, which runs in `board-reconcile-fixtures.yml`.
# That script's header cites the GitHub documentation it relies on.
#
# NO PAT, NO ENVIRONMENT. Issue field VALUES are read and written through the
# REST issue-field-values endpoints, which GitHub documents for installation
# tokens with the repository "Issues" permission — so the workflow's own
# `GITHUB_TOKEN` with `issues: write` is the only credential. The one other
# read, the field DEFINITIONS, is GraphQL `Repository.issueFields` on the same
# token; the docs name no permission for it, so the first live run is what
# proves it, and it fails loudly (writing nothing) if the token is refused.
# The token is scoped to this repository, so a write to any other repository
# cannot happen even by mistake. The `main` ref check stays: only main's copy
# of this file writes. `pull-requests: read` is the one addition for the
# dates: pull requests are read through the issue listing, and the token is an
# installation token, for which the docs do not promise pull requests appear
# in that listing on the Issues permission alone. It grants no write.
#
# WHAT IT COSTS. The Actions token has about 1,000 REST requests an hour for
# this repository, shared with every other workflow here. A scheduled run
# reads every issue and pull request (REST, `state=all`, 100 a page — each
# object already carries its `issue_field_values`; about 17 pages for 1,700
# items), the `thread:` labels (REST) and the field definitions (one GraphQL
# request). Then at most MAX_TIMELINE_READS timeline requests (100), only for
# issues that need one: no Start date yet ('fill'), a Start date still equal to
# the creation day on an open issue changed within START_RECHECK_HOURS
# ('recheck'; a PR or label since may have moved it), or an open item with a
# Target date changed within that window ('reopen'). Nothing is cached in the
# repository; once an issue's Start date is written (and is not the creation
# day) it needs no timeline again. Then it writes only values that differ: one
# request per item for all of its sets, one per cleared value, a second apart,
# at most MAX_WRITES field writes a run. An item awaiting its timeline gets no
# date write that run, and an item's dates are never split across runs, so
# each item is written once. A run so spends at most about 20 + 100 + 300
# requests — well under the hour's budget — and the first fill of about 1,700
# items (two dates each) spreads over roughly a dozen hourly runs; the summary
# states how many timeline reads and writes remain. Each write NOTIFIES the issue's
# subscribers (GitHub documents this for the endpoint), which is another reason
# for the cap. A failed request is classified from its OWN trace by
# `gh-trace-ratelimit-wait.sh`, the reconcile job's parser, run as-is: a
# recognised limit is waited out (bounded by RETRY_WAIT_CAP_SECONDS) and tried
# once more, and a run spends at most ONE such wait. Anything else fails the
# run with the allow-listed evidence (status, rate-limit headers, message) —
# never the trace, which carries response bodies.
#
# NO WATERMARK, and none is needed: each scheduled run compares the WHOLE
# current state (every open issue's labels against its field values), so a
# failed or skipped run loses nothing — the next one sees the same
# difference. Writes are idempotent. The one bounded exception is the
# Start-date recheck, keyed on `updated_at` within START_RECHECK_HOURS: a
# missed window is caught by the issue's next change (a label, the close),
# which is also an event below.
#
# THE LABEL EVENT — included, and bounded. `issues: labeled/unlabeled` runs a
# one-issue pass so a label shows on the issue in seconds rather than up to an
# hour. Its cost is fixed and small: two REST reads, one GraphQL read for the
# field definitions, a timeline read only when that issue's Start date needs
# one (a few pages at most), then at most one add request and four deletes
# (three label fields, the Target date). It runs
# only for a label in one of the three families (the job's `if:`), so other
# labelling costs nothing. Writes made with the Actions token start no
# workflow, so this job's own writes cannot re-trigger it. It shares this
# workflow's concurrency group with the scheduled run: a sweep and an event
# pass must not interleave on the same issue, and a burst of relabelling
# collapses — GitHub keeps one run in progress and one pending and cancels the
# older pending one. A cancelled run loses nothing: the hourly sweep settles
# every issue. The one cost of sharing: an event that arrives while a
# scheduled run is still pending replaces it, and that hour's sweep is
# skipped. The next hour's runs as normal.
#
# CLOSE AND REOPEN — included, for issues. `issues: closed/reopened` runs the
# same one-item pass, so a closed issue's Target date (and a Start date its
# closing PR moves) lands in seconds, and a reopen clears the job's own Target
# date. It costs the label event's reads plus at most a few timeline pages.
#
# PULL REQUESTS — the hourly sweep only, deliberately. A pull request's close
# fires `pull_request`/`pull_request_target`, not `issues`. `pull_request` runs
# the PR's OWN copy of this file on a `refs/pull/...` ref, so the main-only ref
# check would skip it and it could never write; `pull_request_target` would
# run main's copy with a write token on events any fork can cause, the trigger
# zizmor flags as dangerous. A pull request's dates need no timeline and
# settle within the hour, so no PR trigger is added.
#
# OWNER SETUP (done 2026-11-22; this job never creates fields or options): the
# issue fields `Thread` (text), `Priority` (single select, P1…P5) and `Stage`
# (single select: Building, Held-for-Batch, Queued, Waiting-on-Owner,
# Built-not-Closed), defined for the repository's owner; and the DATE fields
# `Start Date` and `Target Date` (added 2026-11-22). If one goes missing, every
# run lists it in its summary, skips its writes and carries on.

on:
  schedule:
    - cron: '47 * * * *' # hourly, off the reconcile job's :23 and the deploy-lag check's :41
  issues:
    types: [labeled, unlabeled, closed, reopened]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Plan and report only; write nothing to the issues.'
        type: boolean
        required: false
        default: false

# Nothing at the workflow level; the one job asks for what it uses.
permissions: {}

concurrency:
  group: board-label-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Mirror priority, stage and thread labels; fill the dates
    # An `issues` event always runs main's copy of this file, so the ref check
    # holds for every real run; a dispatch of another branch's copy writes
    # nothing. For a label event, only the three mirrored families start a run;
    # a close or reopen always does (the dates).
    if: >-
      github.ref == 'refs/heads/main' && (
        github.event_name != 'issues' ||
        github.event.action == 'closed' ||
        github.event.action == 'reopened' ||
        startsWith(github.event.label.name, 'priority:') ||
        startsWith(github.event.label.name, 'stage:') ||
        startsWith(github.event.label.name, 'thread:')
      )
    runs-on: ubuntu-latest
    # Issue field values are written with this token; there is no other secret.
    permissions:
      contents: read # the sparse checkout of the script
      issues: write # read labels, issues and timelines, write issue field values
      pull-requests: read # pull requests in the issue listing, for their dates
    # Reading and writing take a few minutes at most; the rest is the one
    # permitted rate-limit wait (RETRY_WAIT_CAP_SECONDS) with margin.
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_REPO: ${{ github.repository }}
      DRY_RUN: ${{ inputs.dry_run == true }}
      # At most one write request a second, each carrying one issue's sets or
      # one clear, so 300 field writes take at most about five minutes. A
      # backlog larger than this finishes on later runs, and the summary says
      # how many writes were left.
      MAX_WRITES: '300'
      # Timeline requests a run may make (100 events each), for issues still
      # needing a Start date, a recheck or a reopen check. An item read this
      # run is written first, so a read is not wasted on a deferred write.
      MAX_TIMELINE_READS: '100'
      # How recently an issue must have changed for a Start date equal to its
      # creation day (the fallback) to be derived again: two hourly sweeps.
      START_RECHECK_HOURS: '2'
      # The same bounds the reconcile job's board listing uses, for the same
      # measured refill times (#2129, #2134).
      RETRY_WAIT_CAP_SECONDS: '900'
      RETRY_MARGIN_SECONDS: '5'
      EVENT_ISSUE: ${{ github.event.issue.number }}
    steps:
      # The script and the rate-limit parser it runs — a sparse checkout of
      # one directory, no credentials persisted.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Mirror labels onto the issue fields and fill the dates
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "issues" ]; then
            node .github/scripts/board-label-sync.mjs --issue "$EVENT_ISSUE"
          else
            node .github/scripts/board-label-sync.mjs
          fi
