name: Mirror labels onto the Thread, Priority and Stage issue fields

# WHY THIS EXISTS. Labels are the source of truth for an issue's priority,
# stage and owning thread (owner decision 2026-11-22): project agents can set a
# label. This job makes the issue fields follow: `priority:p1`…`priority:p5` →
# the `Priority` issue field, `stage:<name>` → `Stage`, `thread:<name>` →
# `Thread`. These are ISSUE fields defined for the repository's owner, not
# project fields: the value lives on the issue, and the `@vaipakam-labs` board
# views group by it. The direction is one way; nothing here ever reads a field
# to change a label.
#
# The rules — fields matched BY NAME at run time, never by id; single-select
# options (Priority, Stage) matched case-insensitively and written under the
# option's own name; Thread, a text field, written as the label suffix has it;
# a missing field or option reported in the job summary as something to add
# and its writes skipped; two labels of one family writing nothing; an absent
# label clearing only a value this job would itself have written (for Thread,
# only a value that is one of the repository's own `thread:` suffixes); only
# this repository's open issues ever written — live in
# `.github/scripts/board-label-sync.mjs` (`planWrites`) and are pinned by
# `board-label-sync.selftest.mjs`, which runs in `board-reconcile-fixtures.yml`.
# That script's header cites the GitHub documentation it relies on.
#
# NO PAT, NO ENVIRONMENT. Issue field VALUES are read and written through the
# REST issue-field-values endpoints, which GitHub documents for installation
# tokens with the repository "Issues" permission — so the workflow's own
# `GITHUB_TOKEN` with `issues: write` is the only credential. The one other
# read, the field DEFINITIONS, is GraphQL `Repository.issueFields` on the same
# token; the docs name no permission for it, so the first live run is what
# proves it, and it fails loudly (writing nothing) if the token is refused.
# The token is scoped to this repository, so a write to any other repository
# cannot happen even by mistake. The `main` ref check stays: only main's copy
# of this file writes.
#
# WHAT IT COSTS. The Actions token has its own per-repository budget. A
# scheduled run reads the open issues (REST, 100 a page — each issue object
# already carries its `issue_field_values`), the `thread:` labels (REST) and
# the field definitions (one GraphQL request). It writes only values that
# differ: one request per issue for all of its sets, one per cleared value,
# a second apart, at most MAX_WRITES field writes a run, so a first run over a
# large backlog spreads across several hours. Each write NOTIFIES the issue's
# subscribers (GitHub documents this for the endpoint), which is another reason
# for the cap. A failed request is classified from its OWN trace by
# `gh-trace-ratelimit-wait.sh`, the reconcile job's parser, run as-is: a
# recognised limit is waited out (bounded by RETRY_WAIT_CAP_SECONDS) and tried
# once more, and a run spends at most ONE such wait. Anything else fails the
# run with the allow-listed evidence (status, rate-limit headers, message) —
# never the trace, which carries response bodies.
#
# NO WATERMARK, and none is needed: each scheduled run compares the WHOLE
# current state (every open issue's labels against its field values), so a
# failed or skipped run loses nothing — the next one sees the same
# difference. Writes are idempotent.
#
# THE LABEL EVENT — included, and bounded. `issues: labeled/unlabeled` runs a
# one-issue pass so a label shows on the issue in seconds rather than up to an
# hour. Its cost is fixed and small: two REST reads, one GraphQL read for the
# field definitions, then at most one add request and three deletes. It runs
# only for a label in one of the three families (the job's `if:`), so other
# labelling costs nothing. Writes made with the Actions token start no
# workflow, so this job's own writes cannot re-trigger it. It shares this
# workflow's concurrency group with the scheduled run: a sweep and an event
# pass must not interleave on the same issue, and a burst of relabelling
# collapses — GitHub keeps one run in progress and one pending and cancels the
# older pending one. A cancelled run loses nothing: the hourly sweep settles
# every issue. The one cost of sharing: an event that arrives while a
# scheduled run is still pending replaces it, and that hour's sweep is
# skipped. The next hour's runs as normal.
#
# OWNER SETUP (done 2026-11-22; this job never creates fields or options): the
# issue fields `Thread` (text), `Priority` (single select, P1…P5) and `Stage`
# (single select: Building, Held-for-Batch, Queued, Waiting-on-Owner,
# Built-not-Closed), defined for the repository's owner. If one goes missing,
# every run lists it in its summary and carries on.

on:
  schedule:
    - cron: '47 * * * *' # hourly, off the reconcile job's :23 and the deploy-lag check's :41
  issues:
    types: [labeled, unlabeled]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Plan and report only; write nothing to the issues.'
        type: boolean
        required: false
        default: false

# Nothing at the workflow level; the one job asks for what it uses.
permissions: {}

concurrency:
  group: board-label-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Mirror priority, stage and thread labels
    # An `issues` event always runs main's copy of this file, so the ref check
    # holds for every real run; a dispatch of another branch's copy writes
    # nothing. For a label event, only the three mirrored families start a run.
    if: >-
      github.ref == 'refs/heads/main' && (
        github.event_name != 'issues' ||
        startsWith(github.event.label.name, 'priority:') ||
        startsWith(github.event.label.name, 'stage:') ||
        startsWith(github.event.label.name, 'thread:')
      )
    runs-on: ubuntu-latest
    # Issue field values are written with this token; there is no other secret.
    permissions:
      contents: read # the sparse checkout of the script
      issues: write # read labels and issues, write issue field values
    # Reading and writing take a few minutes at most; the rest is the one
    # permitted rate-limit wait (RETRY_WAIT_CAP_SECONDS) with margin.
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_REPO: ${{ github.repository }}
      DRY_RUN: ${{ inputs.dry_run == true }}
      # At most one write request a second, each carrying one issue's sets or
      # one clear, so 300 field writes take at most about five minutes. A
      # backlog larger than this finishes on later runs, and the summary says
      # how many writes were left.
      MAX_WRITES: '300'
      # The same bounds the reconcile job's board listing uses, for the same
      # measured refill times (#2129, #2134).
      RETRY_WAIT_CAP_SECONDS: '900'
      RETRY_MARGIN_SECONDS: '5'
      EVENT_ISSUE: ${{ github.event.issue.number }}
    steps:
      # The script and the rate-limit parser it runs — a sparse checkout of
      # one directory, no credentials persisted.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Mirror labels onto the issue fields
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "issues" ]; then
            node .github/scripts/board-label-sync.mjs --issue "$EVENT_ISSUE"
          else
            node .github/scripts/board-label-sync.mjs
          fi
