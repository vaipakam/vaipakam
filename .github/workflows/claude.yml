name: Claude Code

# Issue and PR-conversation comments and new issues only (#3541). The two
# review-comment events are left out on purpose: they run the PULL REQUEST's
# own copy of this file, so a branch could rewrite it to read the token, and a
# main-only environment would refuse them. A mention in the PR conversation
# still reaches the action.
on:
  issue_comment:
    types: [created]
  issues:
    types: [opened]

jobs:
  claude:
    # Runs only for a comment, review or issue by someone with a role on
    # the repository (#2762). The action also checks the actor has write
    # access; this gate keeps anyone else's mention from starting a job
    # that holds the Claude token at all.
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
    # #3541: the token is a secret of the `main-only` environment, whose
    # deployment-branch rule admits only main. Both events above run main's
    # copy of this file.
    environment: main-only
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write # the action exchanges this OIDC token for its GitHub App token
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@2fee15510437d71399d9139ed60433470484a8fb # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Optional: Give a custom prompt to Claude. If this is not specified, Claude will perform the instructions specified in the comment that tagged it.
          # prompt: 'Update the pull request description to include a summary of changes.'

          # Optional: Add claude_args to customize behavior and configuration
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
          # claude_args: '--allowed-tools Bash(gh pr *)'

