name: Alert issue

# THE OPERATOR ALERT PATH FOR A SCHEDULED PROBE, in one place (#2242). The
# indexer ingest probe (ingest-health.yml, #2469) built it, and the deploy-lag
# check (deploy-lag.yml) needs the same thing. A copy would drift: every rule
# below was a review finding on #2482, and a second copy would have to relearn
# each one. Callers pass what differs (titles, wording, the marker) and their
# probe job's verdict.
#
# WHAT IT DOES. A scheduled run's red X is not an alert anyone is guaranteed to
# receive: GitHub notifies only the account that last edited the cron line,
# and only if that account has Actions notifications on (#2482 r1). So the
# caller's verdict becomes an ISSUE — labelled `infra`, assigned to the
# operator — opened on the first failing run, left alone while the same
# condition lasts, commented and notified again when it changes, and closed
# with a comment on the first healthy run. A run that failed WITHOUT a verdict
# gets its own issue, so the operator is never told a thing is broken when its
# state is unknown (#2482 r2). The optional ops-chat post goes out when the
# issue is opened or changes, and as the fallback when the issue step itself
# failed (#2482 r3).
#
# The caller runs this as its own job after the probe, with `if: always()`, so
# a probe that failed, timed out or was cancelled cannot take the alert down
# with it (#2482 r5). Every value arrives through `env`, never spliced into a
# script, because some of it (the problems) comes from the network.

on:
  workflow_call:
    inputs:
      probe-result:
        description: "The probe job's result (needs.<probe>.result)."
        required: true
        type: string
      verdict:
        description: "The checker step's outcome; `failure` with keys is a verdict."
        required: false
        type: string
        default: ''
      problems:
        description: 'One problem per line, as the operator reads it.'
        required: false
        type: string
        default: ''
      keys:
        description: 'The stable condition (no ages or counts), comma-separated.'
        required: false
        type: string
        default: ''
      assignee:
        description: 'Who the alert issue is assigned to.'
        required: true
        type: string
      unhealthy-title:
        description: 'The issue title for a failing verdict.'
        required: true
        type: string
      unhealthy-intro:
        description: "The issue body's first line, before the problem list."
        required: true
        type: string
      unhealthy-headline:
        description: "The ops-chat message's first line for a failing verdict."
        required: true
        type: string
      healthy-comment:
        description: 'The comment that closes the issue on a healthy run (the run link follows).'
        required: true
        type: string
      broken-title:
        description: 'The issue title for a run that failed before a verdict.'
        required: true
        type: string
      broken-body:
        description: 'What that issue says; the job adds the probe and checker results.'
        required: true
        type: string
      broken-headline:
        description: "The ops-chat message's first line for that case."
        required: true
        type: string
      footer:
        description: "The issue body's closing line (where the probe is defined)."
        required: true
        type: string
      marker:
        description: 'The HTML-comment name the condition is recorded under, e.g. ingest-keys.'
        required: true
        type: string
    secrets:
      TG_OPS_BOT_TOKEN:
        required: false
      TG_OPS_CHAT_ID:
        required: false

permissions:
  issues: write

jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      PROBE_RESULT: ${{ inputs.probe-result }}
      VERDICT: ${{ inputs.verdict }}
      PROBLEMS: ${{ inputs.problems }}
      KEYS: ${{ inputs.keys }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      ASSIGNEE: ${{ inputs.assignee }}
      UNHEALTHY_TITLE: ${{ inputs.unhealthy-title }}
      UNHEALTHY_INTRO: ${{ inputs.unhealthy-intro }}
      UNHEALTHY_HEADLINE: ${{ inputs.unhealthy-headline }}
      HEALTHY_COMMENT: ${{ inputs.healthy-comment }}
      BROKEN_TITLE: ${{ inputs.broken-title }}
      BROKEN_BODY: ${{ inputs.broken-body }}
      BROKEN_HEADLINE: ${{ inputs.broken-headline }}
      FOOTER: ${{ inputs.footer }}
      MARKER: ${{ inputs.marker }}
    steps:
      # Which of three states this run is in, decided once.
      - id: state
        run: |
          case "$MARKER" in *[!a-z0-9-]*|'') echo "::error::marker must be [a-z0-9-]+"; exit 1 ;; esac
          if [ "$PROBE_RESULT" = "success" ]; then s=healthy
          elif [ "$VERDICT" = "failure" ] && [ -n "$KEYS" ]; then s=unhealthy
          else s=broken
          fi
          echo "state=$s" >> "$GITHUB_OUTPUT"
          echo "probe job: $PROBE_RESULT, checker: ${VERDICT:-not run} → $s"
      # The probe is running again as soon as it produced ANY verdict —
      # healthy or not (#2482 r4).
      #
      # Every GitHub call below has its own deadline (`timeout`, well under
      # the job's), and each step has one too, so an API that accepts the
      # connection and never answers fails the step instead of running the
      # job into its limit, where it would be cancelled before the Telegram
      # fallback ran (#2506). The list is captured BEFORE the loop: a failing
      # command substitution inside `for … in $(…)` expands to nothing and
      # the loop succeeds, which would leave a recovered alert open on a
      # green run; as an assignment, its failure fails the step (#2506).
      - name: Close a recovered probe alert
        if: steps.state.outputs.state != 'broken'
        timeout-minutes: 1
        run: |
          open=$(timeout 30 gh issue list --repo "$GITHUB_REPOSITORY" --state open --label infra \
            --search "in:title \"$BROKEN_TITLE\"" --json number,title \
            -q ".[] | select(.title == env.BROKEN_TITLE) | .number")
          for n in $open; do
            timeout 30 gh issue close "$n" --repo "$GITHUB_REPOSITORY" --comment "The probe is producing verdicts again: $RUN_URL"
          done
      # Keyed to the VERDICT alone, never to the step above (#2482 r5).
      - name: Close a recovered health alert
        if: always() && steps.state.outputs.state == 'healthy'
        timeout-minutes: 1
        run: |
          open=$(timeout 30 gh issue list --repo "$GITHUB_REPOSITORY" --state open --label infra \
            --search "in:title \"$UNHEALTHY_TITLE\"" --json number,title \
            -q ".[] | select(.title == env.UNHEALTHY_TITLE) | .number")
          for n in $open; do
            timeout 30 gh issue close "$n" --repo "$GITHUB_REPOSITORY" --comment "$HEALTHY_COMMENT: $RUN_URL"
          done
      # The operator path: one open issue per condition. Opened on the first
      # failing run, left alone while the same condition lasts, commented and
      # re-notified when it changes.
      - id: alert
        name: Alert issue
        if: always() && steps.state.outputs.state != 'healthy'
        # At most three GitHub calls of 30 s each; the Telegram step after it
        # still fits in the job's limit when this one fails or times out.
        timeout-minutes: 2
        env:
          STATE: ${{ steps.state.outputs.state }}
        run: |
          if [ "$STATE" = "unhealthy" ]; then
            title="$UNHEALTHY_TITLE"
            {
              printf '%s\n\n' "$UNHEALTHY_INTRO"
              printf '%s\n' "$PROBLEMS" | sed 's/^/- /'
            } > "$RUNNER_TEMP/alert.md"
          else
            title="$BROKEN_TITLE"
            KEYS="probe-not-running"
            {
              printf '%s\n' "$BROKEN_BODY"
              echo "(probe job: $PROBE_RESULT, checker: ${VERDICT:-not run})"
            } > "$RUNNER_TEMP/alert.md"
          fi
          {
            echo
            echo "First failing run: $RUN_URL"
            echo
            printf '%s\n' "$FOOTER"
          } >> "$RUNNER_TEMP/alert.md"
          echo "<!-- $MARKER: $KEYS -->" >> "$RUNNER_TEMP/alert.md"
          export TITLE="$title"
          open=$(timeout 30 gh issue list --repo "$GITHUB_REPOSITORY" --state open --label infra \
            --search "in:title \"$title\"" --json number,title \
            -q "[.[] | select(.title == env.TITLE)][0].number // empty")
          if [ -z "$open" ]; then
            timeout 30 gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --label infra \
              --assignee "$ASSIGNEE" --body-file "$RUNNER_TEMP/alert.md"
            echo "notify=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Already open: the LATEST recorded condition decides whether anything
          # changed — read ONLY from what this workflow wrote (#2482 r7). The
          # issue is public, so anyone can comment a marker; a forged one must
          # not be able to suppress the next notification. The body counts
          # only when the issue was opened by the workflow's bot, comments only
          # when the bot wrote them.
          last=$(timeout 30 gh issue view "$open" --repo "$GITHUB_REPOSITORY" --json author,body,comments \
            -q '([if .author.login == "github-actions" or .author.login == "app/github-actions" then .body else empty end]
                 + [.comments[] | select(.author.login == "github-actions" or .author.login == "app/github-actions") | .body])
                | map(capture("<!-- " + env.MARKER + ": (?<k>[^ ]*) -->").k) | last // ""')
          if [ "$last" = "$KEYS" ]; then
            echo "#$open already records this condition ($KEYS) — not notifying again."
            echo "notify=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          { echo "The condition changed (was: ${last:-unrecorded})."; echo; cat "$RUNNER_TEMP/alert.md"; } > "$RUNNER_TEMP/update.md"
          timeout 30 gh issue comment "$open" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/update.md"
          echo "notify=true" >> "$GITHUB_OUTPUT"
      # Optional: the repository secrets TG_OPS_BOT_TOKEN and TG_OPS_CHAT_ID
      # (the ops bot — never the user-facing TG_BOT_TOKEN) also post to the
      # ops chat, when the alert issue is opened or its condition changes,
      # AND as the fallback when the issue step itself failed (#2482 r3), so a
      # GitHub API outage cannot leave the operator with only the unreliable
      # red run.
      - name: Telegram (optional)
        if: always() && steps.state.outputs.state != 'healthy' && (steps.alert.outputs.notify == 'true' || steps.alert.outcome == 'failure')
        env:
          TG_TOKEN: ${{ secrets.TG_OPS_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TG_OPS_CHAT_ID }}
          STATE: ${{ steps.state.outputs.state }}
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then
            echo "Telegram secrets not set — the alert issue is the notification."
            exit 0
          fi
          if [ "$STATE" = "unhealthy" ]; then
            text=$(printf '%s\n\n%s\n\n%s' "$UNHEALTHY_HEADLINE" "$PROBLEMS" "$RUN_URL")
          else
            text=$(printf '%s\n\n%s' "$BROKEN_HEADLINE" "$RUN_URL")
          fi
          # A non-2xx answer (revoked token, wrong chat, rate limit) fails the
          # step: an undelivered alert must be visible (#2482 r3).
          code=$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' \
            "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT}" \
            --data-urlencode "text=${text}" \
            --data-urlencode "disable_web_page_preview=true")
          echo "Telegram answered HTTP $code"
          case "$code" in 2??) ;; *) echo "::error title=Alert::Telegram did not accept the alert (HTTP $code)"; exit 1 ;; esac
      # The job reports the probe's verdict as its own result, so the run
      # stays red while the probed thing is unhealthy or unknown.
      - name: Fail while not healthy
        if: always() && steps.state.outputs.state != 'healthy'
        run: exit 1
