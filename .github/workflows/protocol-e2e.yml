# protocol e2e — the protocol's own two-chain Anvil scenarios (#848): the
# positive flows a forge script cannot drive because they need two chains and
# moving time. The repository's CURRENT contracts are deployed from source onto
# two local anvils (a canonical node presenting Base Sepolia and a mirror
# presenting Sepolia), wired by the operator scripts themselves and joined by a
# local CCIP lane of real CCIP contracts and a relay (packages/anvil-harness).
# No secrets, no live RPC: every key is an Anvil well-known development key or
# one minted for the run.
#
# Scenarios today: the interaction-reward claim on Base and on the mirror with
# the day reports, broadcasts and remittance behind it (PF-120, PF-259,
# PF-260), VPFI out and back over the real pools, the tier push and the
# guardian pause (PF-261, PF-257, PF-333). See packages/protocol-e2e/COVERAGE.md.
#
# Modelled on keeper-e2e.yml, with its own forge cache key. NOT a required
# check yet: it is new, and a red here should inform rather than block until it
# has a run history.

name: protocol e2e (anvil)

on:
  pull_request:
    paths:
      - 'packages/protocol-e2e/**'
      - 'packages/anvil-harness/**'
      - 'packages/contracts/**'
      - 'contracts/src/**'
      - 'contracts/script/**'
      - 'contracts/test/mocks/**'
      - 'contracts/lib/**'
      - 'contracts/foundry.toml'
      - 'contracts/remappings.txt'
      - '.github/workflows/protocol-e2e.yml'
  push:
    branches: [main]
    paths:
      - 'packages/protocol-e2e/**'
      - 'packages/anvil-harness/**'
      - 'packages/contracts/**'
      - 'contracts/src/**'
      - 'contracts/script/**'
      - 'contracts/test/mocks/**'
      - 'contracts/lib/**'
      - 'contracts/foundry.toml'
      - 'contracts/remappings.txt'
      - '.github/workflows/protocol-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: protocol-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scenarios:
    name: protocol anvil scenarios
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout (with submodules — the fixture compiles the contracts)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          submodules: recursive

      - name: Install Foundry (forge + anvil)
        uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          # PINNED by number, never `stable` (#1984, owner decision
          # 2026-10-28), in lockstep with mainnet-gate.yml: a toolchain change
          # lands as a reviewed commit, not as an upstream release. Bump by PR.
          version: v1.8.6

      - name: Snapshot submodule SHAs (for content-based cache key)
        working-directory: contracts
        run: git submodule status --recursive > .submodule-state

      - name: Cache forge artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            contracts/out
            contracts/cache
          key: forge-protocol-e2e-${{ runner.os }}-${{ hashFiles('contracts/foundry.toml', 'contracts/remappings.txt', 'contracts/.submodule-state') }}-${{ hashFiles('contracts/src/**/*.sol', 'contracts/script/**/*.sol', 'contracts/test/mocks/**/*.sol') }}
          restore-keys: |
            forge-protocol-e2e-${{ runner.os }}-${{ hashFiles('contracts/foundry.toml', 'contracts/remappings.txt', 'contracts/.submodule-state') }}-

      # The scripts as their own step, so compile time and any compile error
      # stay out of the scenarios' log. The global setup compiles them again,
      # which is then a cache hit.
      - name: Compile the e2e fixture and the two-chain mesh (current contracts)
        working-directory: contracts
        env:
          FOUNDRY_PROFILE: default
        run: |
          forge build script/e2e/DeployE2EFixture.s.sol
          forge build script/e2e/DeployE2ELocalCcip.s.sol
          forge build script/e2e/E2EOperatorScripts.s.sol
          forge build script/e2e/ConfigureMeshRewardsFixture.s.sol

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace deps
        run: pnpm install --frozen-lockfile

      - name: Typecheck the suite
        run: pnpm --filter @vaipakam/protocol-e2e typecheck

      - name: Run the scenarios
        run: pnpm --filter @vaipakam/protocol-e2e run e2e:anvil
