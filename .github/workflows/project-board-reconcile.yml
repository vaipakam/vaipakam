name: Reconcile @vaipakam-labs board

# WHY THIS EXISTS. `add-to-project.yml` fires once, on `issues: opened`,
# and there is no second chance: if that single call fails, the issue is
# never added and nothing notices. The failure is not hypothetical — it
# has a measured rate. Over the 60 runs preceding 2026-09-02, 17 failed
# (28%), every one of them with:
#
#     Request failed due to following response errors:
#      - API rate limit already exceeded for user ID <the PAT's owner>
#
# Projects v2 is GraphQL-only, so the add competes for the SAME 5,000
# point/hour GraphQL bucket as every other tool authenticating as that
# account. When something else drains the bucket, issues opened in that
# window silently miss the board — and CLAUDE.md makes the board the
# single source of truth for what is in flight. A tracker that loses a
# quarter of its intake without saying so is worse than one that is
# visibly behind.
#
# This job is the recovery half: it periodically compares open issues
# against the board and adds whatever is missing, whatever the reason it
# went missing. It deliberately does NOT replace the on-open add — that
# path is what makes a new issue appear within seconds, and it stays.
# This is the net underneath it, and it repairs a backlog as readily as
# a fresh miss.
#
# `addProjectV2ItemById` (what `gh project item-add` calls) is idempotent
# — adding an item already on the board returns the existing item — so a
# spurious add costs a request and changes nothing. That asymmetry is why
# the guards below fail toward re-adding rather than toward skipping.

on:
  schedule:
    - cron: '23 */6 * * *' # four sweeps a day; the GraphQL bucket refills hourly
  workflow_dispatch:

# The PAT does the project read and write; the workflow's own token
# stays read-only, matching add-to-project.yml's least-privilege shape.
# `issues: read` is what lets the first step use GITHUB_TOKEN instead of
# the PAT — see the note on that step.
permissions:
  contents: read
  issues: read
  # For the last-success watermark: reading this workflow's own run
  # history is an Actions-API read, and an explicit `permissions` block
  # grants nothing it does not name.
  actions: read

concurrency:
  group: project-board-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    name: Add un-boarded open issues
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.ADD_TO_PROJECT_PAT }}
      PROJECT_OWNER: vaipakam
      PROJECT_NUMBER: '1'
      ISSUE_REPO: ${{ github.repository }}
      # Board listing only — the issue listing paginates and needs no
      # limit. Generous enough for the whole history with room to grow,
      # and the step ABORTS rather than proceed on a short read.
      LIST_LIMIT: '4000'
      # MINIMUM look-back for CLOSED issues. The real window stretches to
      # cover everything since the last successful sweep — see the note on
      # the watermark — so this is the floor for the normal case, not a
      # cutoff that can expire an unrecovered card.
      CLOSED_LOOKBACK_DAYS: '14'
      # This workflow's own filename, for the last-success watermark read.
      WORKFLOW_FILE: project-board-reconcile.yml
    steps:
      - name: List issues the board should hold
        env:
          # GITHUB_TOKEN, NOT THE PAT — a DIFFERENT IDENTITY, and that is
          # the point. Moving this listing to REST (#2056) was not enough:
          # the next run failed here too, with `HTTP 403 API rate limit
          # exceeded for user ID …`. Both of that account's budgets are
          # routinely spent, because everything authenticating as it
          # shares them.
          #
          # Listing this repo's own issues needs nothing the PAT provides.
          # The Actions token has its own per-repository budget that no
          # other tool touches, so this step is now immune to whatever the
          # account is doing elsewhere. Only the project steps below
          # genuinely need the PAT: Projects v2 lives under a user
          # account, which the repo-scoped token cannot reach at all.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # REST, NOT `gh issue list`. The first run of this workflow died
          # here with the very error it was written to survive, because
          # `gh issue list` is GraphQL and so drew on the same drained
          # bucket as the add it is meant to repair. REST has a separate
          # budget, so the step that decides WHAT is missing no longer
          # competes with the step that fixes it.
          #
          # `--paginate` follows every page, so there is no limit to hit
          # and no truncation guard to get wrong. REST's issues endpoint
          # returns pull requests as well — they carry a `pull_request`
          # key, and a PR left in this list would be "missing from the
          # board" forever, re-added on every sweep.
          issue_urls() {
            gh api --paginate "repos/$ISSUE_REPO/issues?per_page=100&$1" \
              --jq '.[] | select(has("pull_request") | not) | .html_url'
          }

          issue_urls 'state=open' | sort -u > open-urls.txt
          echo "open issues: $(wc -l < open-urls.txt | tr -d ' ')"

          # RECENTLY CLOSED ONES TOO, and #2054 is why: the issue that
          # reported this whole defect was itself lost by it. Its add
          # failed at 12:32, the PR fixing it closed the issue at 12:53,
          # and the 13:26 sweep — looking only at open issues — could no
          # longer see it. A card that is created and closed between two
          # sweeps falls through the net permanently, which is precisely
          # the shape of loss the net exists to catch.
          #
          # `since` filters on updated_at, so this is "closed issues
          # touched in the window", which is what a missed add needs.
          #
          # THE WINDOW REACHES BACK TO THE LAST SUCCESSFUL SWEEP, not a
          # fixed span. A rolling cutoff quietly expires the very entries
          # this workflow exists to recover: if writes are unavailable for
          # longer than the span — an expired PAT, Actions disabled, a
          # long run of rate-limit failures — a missing closed issue ages
          # out, and the first sweep that finally works omits it and
          # reports success. Permanently lost, under a green tick. That is
          # the same reassuring lie in a third place.
          #
          # So the floor below is a MINIMUM, and the actual window is
          # whichever is longer: the floor, or the time since this
          # workflow last completed successfully. An outage therefore
          # widens the next sweep by exactly as much as it cost. The
          # Actions API read runs on the same repo-scoped token as the
          # listings, so it costs nothing from the contended account.
          floor=$(date -u -d "$CLOSED_LOOKBACK_DAYS days ago" +%s)
          last_success=$(gh api \
            "repos/$ISSUE_REPO/actions/workflows/$WORKFLOW_FILE/runs?status=success&per_page=1" \
            --jq '.workflow_runs[0].created_at // empty')
          if [ -n "$last_success" ]; then
            # A day of margin so a run that straddles the boundary cannot
            # leave a sliver of time neither sweep looked at.
            watermark=$(( $(date -u -d "$last_success" +%s) - 86400 ))
            echo "last successful sweep: $last_success"
          else
            watermark=$floor
            echo "no previous successful sweep — using the floor"
          fi
          # Whichever reaches back further wins.
          if [ "$watermark" -gt "$floor" ]; then watermark=$floor; fi
          since=$(date -u -d "@$watermark" +%Y-%m-%dT%H:%M:%SZ)

          issue_urls "state=closed&since=$since" | sort -u > closed-urls.txt
          echo "recently closed issues (since $since): $(wc -l < closed-urls.txt | tr -d ' ')"

          sort -u open-urls.txt closed-urls.txt > wanted-urls.txt
          echo "issues the board should hold: $(wc -l < wanted-urls.txt | tr -d ' ')"

      - name: List board items
        run: |
          set -euo pipefail
          # Projects v2 has no REST surface, so this step and the adds
          # below are unavoidably GraphQL. Report the budget first: when
          # this job fails, the log should say whether it ran out of
          # points or hit something else. `rate_limit` is REST and is not
          # itself metered.
          remaining=$(gh api rate_limit --jq '.resources.graphql.remaining')
          echo "GraphQL points remaining: $remaining"

          gh project item-list "$PROJECT_NUMBER" --owner "$PROJECT_OWNER" \
            --format json --limit "$LIST_LIMIT" > board.json
          items=$(jq '.items | length' board.json)
          total=$(jq '.totalCount // (.items | length)' board.json)
          echo "board items: $items (totalCount $total)"
          # Truncation here is the harmless direction — a board issue read
          # as absent is re-added idempotently — but it inflates every run
          # and hides the real number, so it is still an error.
          if [ "$items" -lt "$total" ]; then
            echo "::error::board listing returned $items of $total items — raise LIST_LIMIT"
            exit 1
          fi

      - name: Add whatever is missing
        env:
          # The PAT (job-level GH_TOKEN) does the project work; this is
          # the repo-scoped token, for the pre-write issue-state recheck.
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Board items carry the issue's URL; matching on that rather
          # than on the number avoids confusing issue #42 of this repo
          # with #42 of another repo feeding the same board.
          #
          # Each item's id and Status come along for the ride, because
          # reconciling Status cannot depend on whether the card was
          # added on THIS sweep — see the status pass below.
          jq -r '.items[]
                 | select(.content.type == "Issue")
                 | [.content.url, .id, (.status // "")]
                 | @tsv' board.json > board-items.tsv
          cut -f1 board-items.tsv | sort -u > board-urls.txt
          comm -23 wanted-urls.txt board-urls.txt > missing.txt

          missing=$(wc -l < missing.txt | tr -d ' ')
          echo "missing from board: $missing"
          {
            echo "## Board reconciliation"
            echo
            echo "- open issues: $(wc -l < open-urls.txt | tr -d ' ')"
            echo "- recently closed issues: $(wc -l < closed-urls.txt | tr -d ' ')"
            echo "- already on the board: $(wc -l < board-urls.txt | tr -d ' ')"
            echo "- missing: $missing"
          } >> "$GITHUB_STEP_SUMMARY"

          # NOTE: no early exit when nothing is missing. The status pass
          # at the end has its own work to do — a card added by an earlier
          # sweep whose Status write failed is present on the board and so
          # will never appear here again.

          # A RECOVERED CLOSED CARD LANDS IN THE WRONG COLUMN unless we
          # say otherwise. New cards enter Backlog, and Status moves to
          # Done by the project's close automation — which fires on the
          # close EVENT. A card added after its issue closed missed that
          # event and can never receive it, so finished work would sit in
          # the backlog looking active. ProjectProcedures.md §5.3 is
          # explicit that a closed card is Done.
          #
          # Look the ids up once, by NAME, and treat their absence as a
          # warning rather than a failure: the card being on the board is
          # the point, and a project that renames its Status field should
          # not turn the whole sweep red.
          status_field_id=''
          done_option_id=''
          project_id=$(gh project view "$PROJECT_NUMBER" --owner "$PROJECT_OWNER" \
            --format json --jq '.id' 2>/dev/null || true)
          if [ -n "$project_id" ]; then
            fields=$(gh project field-list "$PROJECT_NUMBER" --owner "$PROJECT_OWNER" \
              --format json 2>/dev/null || echo '{}')
            status_field_id=$(printf '%s' "$fields" | jq -r '
              (.fields // [])[]
              | select((.name // "") | ascii_downcase == "status")
              | .id' | head -1)
            done_option_id=$(printf '%s' "$fields" | jq -r '
              (.fields // [])[]
              | select((.name // "") | ascii_downcase == "status")
              | (.options // [])[]
              | select((.name // "") | ascii_downcase == "done")
              | .id' | head -1)
          fi
          # Whether an unresolved id is fatal is decided at the end, with
          # the rest of the status outcome — see the note on the exit.

          : > added-items.tsv
          failed=0
          if [ "$missing" -gt 0 ]; then
          echo >> "$GITHUB_STEP_SUMMARY"
          echo "### Added" >> "$GITHUB_STEP_SUMMARY"
          while read -r url; do
            [ -n "$url" ] || continue
            added=0
            # Three quick attempts absorb a transient error. They will NOT
            # outlast an exhausted GraphQL bucket, and are not meant to:
            # that case is what the six-hourly schedule is for. The job
            # still fails, because the board really is incomplete until
            # the next sweep — a green run over a short board is exactly
            # the reassuring lie this workflow exists to end.
            for attempt in 1 2 3; do
              # `< /dev/null` is load-bearing: this loop reads its list on
              # stdin, and any command inside it that touched stdin would
              # swallow the remaining URLs — the loop would then "succeed"
              # having processed one issue.
              if item_id=$(gh project item-add "$PROJECT_NUMBER" \
                   --owner "$PROJECT_OWNER" --url "$url" \
                   --format json --jq '.id' < /dev/null); then
                added=1
                break
              fi
              sleep $((attempt * 15))
            done
            if [ "$added" -eq 1 ]; then
              # A brand-new card has no Status yet; the pass below sets it
              # if the issue is closed.
              printf '%s\t%s\t\n' "$url" "$item_id" >> added-items.tsv
              echo "- $url" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::error::could not add $url"
              echo "- FAILED: $url" >> "$GITHUB_STEP_SUMMARY"
              failed=$((failed + 1))
            fi
          done < missing.txt
          fi

          # THE STATUS PASS IS SEPARATE FROM ADDING, and has to be. Setting
          # Status only at the moment of the add makes the transition
          # single-shot in the same way the on-open workflow was: if that
          # one write fails — an exhausted budget, a transient error — the
          # card is on the board from then on, so it never appears in
          # `missing.txt` again and its Status is never retried. Finished
          # work would sit in the backlog permanently, which is this
          # workflow's own defect wearing a smaller hat.
          #
          # So the pass runs over every recently-closed issue the board
          # knows about, added on this sweep or long before, and fixes any
          # whose Status is not Done. That makes it idempotent and
          # self-healing: a failure here is retried by the next sweep
          # rather than being frozen in, which is why a warning is honest
          # and a hard failure would not add anything.
          status_unfixed=0
          if [ -z "$project_id" ] || [ -z "$status_field_id" ] || [ -z "$done_option_id" ]; then
            echo "::error::could not resolve the Status/Done ids — closed cards cannot be moved to Done"
            status_unfixed=1
          else
            cat board-items.tsv added-items.tsv > known-items.tsv
            with_status=$(awk -F'\t' '$3 != ""' board-items.tsv | wc -l | tr -d ' ')
            if [ "$with_status" -eq 0 ] && [ -s board-items.tsv ]; then
              # THE CHECK HAS GONE BLIND. Every board item reporting an
              # empty Status means the field is not where this jq looks,
              # not that the whole board is unset — and acting on it would
              # rewrite Status on every recovered card each sweep.
              echo "::error::no board item exposes a Status value — skipping the status pass rather than rewriting every card"
              status_unfixed=1
            else
              needing=0; fixed=0; unfixed=0; unknown=0
              while read -r url; do
                [ -n "$url" ] || continue
                row=$(awk -F'\t' -v u="$url" '$1 == u {print $2 "\t" $3; exit}' known-items.tsv)
                [ -n "$row" ] || continue
                id=$(printf '%s' "$row" | cut -f1)
                st=$(printf '%s' "$row" | cut -f2 | tr '[:upper:]' '[:lower:]')
                { [ -n "$id" ] && [ "$st" != "done" ]; } || continue

                # RE-READ THE ISSUE BEFORE WRITING. `closed-urls.txt` is a
                # snapshot taken at the start of the job; an issue reopened
                # since then is still in it, and writing Done on a reopened
                # issue is a change nothing here would ever undo — this
                # pass is driven by the CLOSED listing, so on the next
                # sweep that issue appears only among the open ones and is
                # never looked at again. Active work, permanently shown as
                # finished.
                #
                # The read runs as the repo-scoped token, so the recheck
                # costs nothing from the contended account, and it happens
                # only for cards actually about to change.
                state=$(GH_TOKEN="$REPO_TOKEN" gh api \
                  "repos/$ISSUE_REPO/issues/${url##*/}" --jq '.state' \
                  < /dev/null 2>/dev/null || echo '')
                case "$state" in
                  closed) ;;
                  open)
                    echo "::warning::$url is no longer closed — leaving its Status alone"
                    continue
                    ;;
                  *)
                    # "COULD NOT TELL" IS NOT "OPEN". Reading a failed
                    # request as a reopened issue would skip the card
                    # silently and let the run finish green — which
                    # advances the watermark past a card that may still
                    # need Done. Every unreadable state holds the
                    # boundary instead.
                    echo "::error::could not read the state of $url"
                    unknown=$((unknown + 1))
                    continue
                    ;;
                esac

                needing=$((needing + 1))
                ok=0
                for attempt in 1 2 3; do
                  if gh project item-edit --id "$id" \
                       --project-id "$project_id" \
                       --field-id "$status_field_id" \
                       --single-select-option-id "$done_option_id" < /dev/null; then
                    ok=1
                    break
                  fi
                  sleep $((attempt * 15))
                done
                if [ "$ok" -eq 1 ]; then fixed=$((fixed + 1)); else unfixed=$((unfixed + 1)); fi
              done < closed-urls.txt

              echo "closed cards needing Done: $needing (moved $fixed, still not $unfixed, state unreadable $unknown)"
              if [ "$needing" -gt 0 ] || [ "$unknown" -gt 0 ]; then
                {
                  echo
                  echo "### Closed cards moved to Done"
                  echo "- moved: $fixed"
                  [ "$unfixed" -eq 0 ] || echo "- still not Done (next sweep retries): $unfixed"
                  [ "$unknown" -eq 0 ] || echo "- state unreadable, left alone: $unknown"
                } >> "$GITHUB_STEP_SUMMARY"
              fi
              status_unfixed=$((unfixed + unknown))
            fi
          fi

          # AN UNFIXED STATUS HAS TO FAIL THE RUN, and the reason is the
          # watermark rather than severity. The closed look-back reaches
          # back to the last SUCCESSFUL sweep, so a green run advances it:
          # a card left outside Done under a green tick would drop out of
          # the window a fortnight later and never be looked at again. Red
          # holds the watermark where it is, and the next sweep sees the
          # same card. The two mechanisms only work as a pair.
          if [ "$status_unfixed" -gt 0 ]; then
            echo "::error::$status_unfixed closed card(s) are not Done; failing so the watermark does not advance past them"
          fi
          if [ "$failed" -gt 0 ]; then
            echo "::error::$failed issue(s) still missing from the board; the next scheduled sweep will retry"
          fi
          if [ "$failed" -gt 0 ] || [ "$status_unfixed" -gt 0 ]; then
            exit 1
          fi
