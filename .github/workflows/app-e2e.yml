# app e2e — the standard automatic regression for the retail app
# (docs/TestScopes/Alpha02RegressionFlows.md). Runs the real built app
# against a LOCAL anvil carrying the repository's CURRENT contracts,
# deployed from source by the e2e global setup and presented as Base
# Sepolia (apps/app/e2e/lib/fixture.ts, #2334), with a chain-hydrated
# indexer stub and ephemeral per-run wallets — no secrets, no live RPC.
#
# Until #2334 this forked live Base Sepolia, so a run tested the
# testnet's deployed bytecode and whatever state it held at that block:
# a spec could fail on live state that moved between two runs of one
# commit, and a contract change was invisible here until an operator
# redeployed. The job's inputs are now the commit and nothing else.
#
# Trigger scope: the app and the shared workspace code it imports, AND
# the contract sources the fixture compiles — a contract change now
# reaches this suite directly, before any testnet deploy. There is no
# nightly run any more: it existed to catch the live testnet moving
# under an unchanged app, and nothing live is read.
# NOTE — the display name below deliberately still says `alpha02`, even
# though the app is now apps/app (#1854). A required status check is keyed
# on "<workflow name> / <job name>", so renaming it would strand
# `alpha02 e2e (anvil fork) / fork-tier scenarios` as permanently PENDING
# and block the merge of every PR. Changing it is an operator action:
# update branch protection first, then rename here. Same reasoning as the
# `defi vitest` workflow, which has carried this note since #1076.
# (The "(anvil fork)" in the name is historical for the same reason: the
# chain is no longer a fork, but the check name is keyed on it.)
name: alpha02 e2e (anvil fork)

on:
  pull_request:
    paths:
      - 'apps/app/**'
      - 'packages/contracts/**'
      - 'packages/lib/**'
      - 'packages/anvil-harness/**'
      - 'contracts/src/**'
      - 'contracts/script/**'
      - 'contracts/test/mocks/**'
      - 'contracts/lib/**'
      - 'contracts/foundry.toml'
      - 'contracts/remappings.txt'
      - '.github/workflows/app-e2e.yml'
  push:
    branches: [main]
    paths:
      - 'apps/app/**'
      - 'packages/contracts/**'
      - 'packages/lib/**'
      - 'packages/anvil-harness/**'
      - 'contracts/src/**'
      - 'contracts/script/**'
      - 'contracts/test/mocks/**'
      - 'contracts/lib/**'
      - 'contracts/foundry.toml'
      - 'contracts/remappings.txt'
      - '.github/workflows/app-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: fork-tier scenarios
    runs-on: ubuntu-latest
    # A cold fixture compile (viaIR, every facet) adds several minutes to
    # what the fork-based run took; the forge cache below makes most runs
    # incremental.
    timeout-minutes: 60
    steps:
      - name: Checkout (with submodules — the fixture compiles the contracts)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          submodules: recursive

      - name: Install Foundry (forge + anvil)
        uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          # PINNED by number, never `stable` (#1984, owner decision
          # 2026-10-28), in lockstep with mainnet-gate.yml: a toolchain change
          # lands as a reviewed commit, not as an upstream release. Bump by PR.
          version: v1.8.6

      # Same content-keyed design as ci.yml's contracts cache (see the note
      # there for why the restore-key is a literal prefix of the key), under
      # its own prefix: the fixture builds with the `default` profile, not
      # `cifast`, so the two artifact trees are not interchangeable.
      - name: Snapshot submodule SHAs (for content-based cache key)
        working-directory: contracts
        run: git submodule status --recursive > .submodule-state

      - name: Cache forge artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            contracts/out
            contracts/cache
          key: forge-e2e-${{ runner.os }}-${{ hashFiles('contracts/foundry.toml', 'contracts/remappings.txt', 'contracts/.submodule-state') }}-${{ hashFiles('contracts/src/**/*.sol', 'contracts/script/**/*.sol', 'contracts/test/mocks/**/*.sol') }}
          restore-keys: |
            forge-e2e-${{ runner.os }}-${{ hashFiles('contracts/foundry.toml', 'contracts/remappings.txt', 'contracts/.submodule-state') }}-

      # Global setup compiles too, but doing it as its own step keeps the
      # compile's time and any compile error out of the Playwright log.
      - name: Compile the e2e fixture (current contracts)
        working-directory: contracts
        env:
          FOUNDRY_PROFILE: default
        run: forge build script/e2e/DeployE2EFixture.s.sol

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace deps
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter @vaipakam/app exec playwright install --with-deps chromium

      - name: Typecheck the e2e surface
        run: pnpm --filter @vaipakam/app run e2e:typecheck

      - name: Run e2e
        run: pnpm --filter @vaipakam/app run e2e

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-e2e-traces
          path: apps/app/test-results/
          retention-days: 7
      # Inline failure context: the page snapshot Playwright writes per
      # failure, printed straight into the job log so a diagnosis never
      # requires downloading the trace artifact (added while debugging
      # the #1082 08-spec failure from an environment that can't fetch
      # artifacts).
      - name: Print failure context
        if: failure()
        run: |
          for f in apps/app/test-results/*/error-context.md; do
            [ -f "$f" ] || continue
            echo "===== $f ====="
            cat "$f"
          done
