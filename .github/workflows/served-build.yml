name: Served build

# WHY THIS EXISTS (#3236). The deploy-lag check (deploy-lag.yml) asks whether
# each Worker runs `main`, and trusts the deploy stamp for what it runs. This
# check asks whether the bytes a visitor receives are what that commit builds:
# it rebuilds the stamped commit of each site in .github/served-build.json
# with the build variables recorded there, and compares every served file and
# the root security headers with the build, on every host. Builds are
# reproducible (#3273), so a difference is a finding. What it compares, what
# it cannot see and what each failure means are in
# .github/scripts/check-served-build.mjs (`--selftest`).
#
# It needs the same read-only access as the deploy-lag check: the repository
# secret CLOUDFLARE_DEPLOY_READ_TOKEN (Account · Workers Scripts · Read) and
# the repository variable CLOUDFLARE_ACCOUNT_ID. The build runs with no token
# in its environment, and only for a commit that is on `main`: it executes
# that commit's code, which is the same trust this workflow already gives
# `main` (a process of the same user could still read the parent's
# environment, so the token is the read-only one and nothing else).
#
# HOW THE OPERATOR HEARS OF IT: the shared alert path (alert-issue.yml), an
# issue titled "Served build differs from its commit", assigned, notified once
# per changed condition and closed on the first clean run.

on:
  schedule:
    - cron: '23 */6 * * *' # every six hours, off the hour
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/scripts/check-served-build.mjs'
      - '.github/scripts/lib/workerDeployments.mjs'
      - '.github/scripts/lib/approvalRecord.mjs'
      - '.github/served-build.json'
      - '.github/workflows/served-build.yml'
      - '.github/workflows/alert-issue.yml'
      - '.github/scripts/promote-site.mjs'
      - '.github/workflows/promote-site.yml'
      - '.github/workflows/promote-one.yml'
      - 'packages/lib/src/deployStamp.mjs'
      - 'packages/lib/bin/wrangler-deploy.mjs'

permissions:
  contents: read # the alert job adds issues: write for itself

concurrency:
  group: served-build-${{ github.event_name == 'pull_request' && 'selftest' || 'probe' }}
  cancel-in-progress: false

jobs:
  selftest:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node .github/scripts/check-served-build.mjs --selftest
      - run: node .github/scripts/promote-site.mjs --selftest

  probe:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    # #3541: this job reads secrets. They live in the `main-only` environment,
    # whose deployment-branch rule admits only main, so a run of a pushed
    # branch's copy of this file receives none of them; the ref check says the
    # same thing in the file, for a reader.
    environment: main-only
    runs-on: ubuntu-latest
    # One install per deployed commit and one build per site (a few minutes
    # each), then about a thousand small fetches.
    timeout-minutes: 45
    permissions:
      contents: read
      # The deploy-approval record (#3236): promote-site.yml's runs, their
      # jobs and those jobs' annotations. Read only, and unused while
      # SITE_DEPLOY_APPROVAL is off.
      actions: read
      checks: read
    outputs:
      verdict: ${{ steps.check.outcome }}
      problems: ${{ steps.check.outputs.problems }}
      keys: ${{ steps.check.outputs.keys }}
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_DEPLOY_READ_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_READ_TOKEN }}
      SERVED_BUILD_REF: HEAD
      # On (at mainnet), a live version no approval run put there is a finding.
      SITE_DEPLOY_APPROVAL: ${{ vars.SITE_DEPLOY_APPROVAL }}
      # Kept out of the build's environment like the Cloudflare token
      # (buildEnv is an allowlist).
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      # The whole history: the deployed commit is checked out from it, and
      # must be on main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0
          # The builds run code from the deployed commit; leave them no
          # GitHub credential in the checkout.
          persist-credentials: false
      # The version comes from the root package.json's packageManager field.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - id: check
        run: node .github/scripts/check-served-build.mjs

  alert:
    needs: probe
    if: always() && github.event_name != 'pull_request'
    permissions:
      issues: write
    uses: ./.github/workflows/alert-issue.yml
    with:
      probe-result: ${{ needs.probe.result }}
      verdict: ${{ needs.probe.outputs.verdict }}
      problems: ${{ needs.probe.outputs.problems }}
      keys: ${{ needs.probe.outputs.keys }}
      assignee: vaipakam
      unhealthy-title: Served build differs from its commit
      unhealthy-intro: 'The scheduled served-build check found a site not serving what its recorded commit builds, or one it could not verify:'
      unhealthy-headline: A site is not serving what its commit builds
      healthy-comment: Every site is serving exactly what its commit builds again
      broken-title: Served-build check not running
      broken-body: The scheduled served-build check failed before it could judge the sites, so whether they serve what their commits build is UNKNOWN, not known to differ. The run log says what broke.
      broken-headline: The served-build check failed before it could judge (state unknown)
      footer: This issue closes itself on the first clean run. See .github/workflows/served-build.yml (#3236) and the incident runbook, section 9.
      marker: served-build-keys
    secrets:
      TG_OPS_BOT_TOKEN: ${{ secrets.TG_OPS_BOT_TOKEN }}
      TG_OPS_CHAT_ID: ${{ secrets.TG_OPS_CHAT_ID }}
