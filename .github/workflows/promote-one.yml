name: Promote one site

# One site's approve-to-go-live, called by promote-site.yml (#3236). Read
# that file first: it says when this runs and why.

on:
  workflow_call:
    inputs:
      site:
        type: string
        required: true
      commit:
        type: string
        required: true
    secrets:
      # Since #3541 a secret of the `main-only` environment (the candidate job)
      # and of site-production (the promote job), not of the repository, so
      # the caller's scope has no value for it and it cannot be required.
      CLOUDFLARE_DEPLOY_READ_TOKEN:
        required: false
      # An environment secret of site-production. A reusable workflow sees it
      # only when the caller passes it by name (otherwise it reads as empty,
      # with no error). It still resolves only in the job that names that
      # environment, so the candidate job never holds it. Not required: the
      # caller's own scope has no value for it, and the deploy step refuses an
      # empty token by name.
      CLOUDFLARE_PROMOTE_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  candidate:
    # #3541: only main's copy of this file reads the read token, from the
    # `main-only` environment, whose deployment-branch rule admits only main.
    if: github.ref == 'refs/heads/main'
    environment: main-only
    runs-on: ubuntu-latest
    # Up to 30 minutes waiting for the Workers Build (they run one at a time
    # on this account), then one install and one build of the commit.
    timeout-minutes: 60
    outputs:
      state: ${{ steps.find.outputs.state }}
      version: ${{ steps.find.outputs.version }}
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_DEPLOY_READ_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_READ_TOKEN }}
      SITE: ${{ inputs.site }}
      COMMIT: ${{ inputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0
          # The compare builds the commit's code; leave it no GitHub credential.
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - id: find
        run: node .github/scripts/promote-site.mjs find --site "$SITE" --commit "$COMMIT"
      # Only a pending version is compared and offered. A failed compare
      # fails this job, so nobody is asked to approve it.
      - if: steps.find.outputs.state == 'pending'
        env:
          # The commit must be on main, whatever ref the run was started from.
          SERVED_BUILD_REF: origin/main
          VERSION: ${{ steps.find.outputs.version }}
        run: node .github/scripts/check-served-build.mjs --site "$SITE" --version "$VERSION"

  promote:
    needs: candidate
    if: needs.candidate.outputs.state == 'pending' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The approval. Its required reviewer is a person, and its secret
    # CLOUDFLARE_PROMOTE_TOKEN (Workers Scripts Edit) exists only here.
    environment:
      name: site-production
    # A newer merge of the same site replaces one still waiting for approval.
    concurrency:
      group: promote-${{ inputs.site }}
      cancel-in-progress: true
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_DEPLOY_READ_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_READ_TOKEN }}
      CLOUDFLARE_PROMOTE_TOKEN: ${{ secrets.CLOUDFLARE_PROMOTE_TOKEN }}
      SITE: ${{ inputs.site }}
      COMMIT: ${{ inputs.commit }}
      VERSION: ${{ needs.candidate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node .github/scripts/promote-site.mjs deploy --site "$SITE" --commit "$COMMIT" --version "$VERSION"
