name: Promote one site

# One site's approve-to-go-live, called by promote-site.yml (#3236). Read
# that file first: it says when this runs and why.

on:
  workflow_call:
    inputs:
      site:
        type: string
        required: true
      commit:
        type: string
        required: true
    secrets:
      CLOUDFLARE_DEPLOY_READ_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    # Up to 30 minutes waiting for the Workers Build (they run one at a time
    # on this account), then one install and one build of the commit.
    timeout-minutes: 60
    outputs:
      state: ${{ steps.find.outputs.state }}
      version: ${{ steps.find.outputs.version }}
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_DEPLOY_READ_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_READ_TOKEN }}
      SITE: ${{ inputs.site }}
      COMMIT: ${{ inputs.commit }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          # The compare builds the commit's code; leave it no GitHub credential.
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - id: find
        run: node .github/scripts/promote-site.mjs find --site "$SITE" --commit "$COMMIT"
      # Only a pending version is compared and offered. A failed compare
      # fails this job, so nobody is asked to approve it.
      - if: steps.find.outputs.state == 'pending'
        env:
          # The commit must be on main, whatever ref the run was started from.
          SERVED_BUILD_REF: origin/main
          VERSION: ${{ steps.find.outputs.version }}
        run: node .github/scripts/check-served-build.mjs --site "$SITE" --version "$VERSION"

  promote:
    needs: candidate
    if: needs.candidate.outputs.state == 'pending'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The approval. Its required reviewer is a person, and its secret
    # CLOUDFLARE_PROMOTE_TOKEN (Workers Scripts Edit) exists only here.
    environment:
      name: site-production
    # A newer merge of the same site replaces one still waiting for approval.
    concurrency:
      group: promote-${{ inputs.site }}
      cancel-in-progress: true
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_DEPLOY_READ_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_READ_TOKEN }}
      CLOUDFLARE_PROMOTE_TOKEN: ${{ secrets.CLOUDFLARE_PROMOTE_TOKEN }}
      SITE: ${{ inputs.site }}
      COMMIT: ${{ inputs.commit }}
      VERSION: ${{ needs.candidate.outputs.version }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: node .github/scripts/promote-site.mjs deploy --site "$SITE" --commit "$COMMIT" --version "$VERSION"
