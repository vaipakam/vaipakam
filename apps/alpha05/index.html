<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="noindex" />
    <meta
      name="description"
      content="Vaipakam — non-custodial, vault-to-vault lending, borrowing and NFT rental. Lender and borrower agree a fixed rate and term; offers and collateral wait in your own vault."
    />
    <title>Vaipakam</title>
    <!-- Brand assets are the www set (apps/www/public), copied as files so the
         app never loads its identity cross-origin: the icon mark per colour
         scheme (browsers without `media` on icon links take the first) and
         the 512 px raster for home-screen icons. -->
    <link rel="icon" href="/icon-light.svg" type="image/svg+xml" media="(prefers-color-scheme: light)" />
    <link rel="icon" href="/icon-dark.svg" type="image/svg+xml" media="(prefers-color-scheme: dark)" />
    <link rel="apple-touch-icon" href="/icon-light.png" />
    <!-- The install manifest (ACC-11): name, icons and the four shortcuts. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#4f46e5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0c111d" media="(prefers-color-scheme: dark)" />
    <script>
      // Apply the persisted (or system) theme before first paint so the page
      // never flashes the wrong background. The React ThemeProvider takes
      // over after hydration. The key is shared with apps/app on purpose: a
      // user's choice carries over when this app takes the hostname.
      (function () {
        try {
          var stored = localStorage.getItem('app.theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.dataset.theme = theme;
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
    <script>
      // Language and direction bootstrap, mirroring the shared i18n
      // detection chain (packages/i18n createI18n.ts) so lang/dir are right
      // during the first paint. SUPPORTED mirrors SUPPORTED_LOCALES in
      // packages/i18n, TRANSLATED mirrors src/i18n/translatedLocales.json,
      // RTL mirrors RTL_LOCALES; grow them together.
      (function () {
        function readCookie(name) {
          var prefix = name + '=';
          var parts = document.cookie ? document.cookie.split(';') : [];
          for (var i = 0; i < parts.length; i++) {
            var seg = parts[i].replace(/^\s+/, '');
            if (seg.indexOf(prefix) === 0) {
              try { return decodeURIComponent(seg.slice(prefix.length)); } catch (_) { return null; }
            }
          }
          return null;
        }
        var SUPPORTED = ['en','es','fr','de','ja','zh','hi','ar','ta','ko','te','kn','ml','bn','mr','pa','gu','ur','vi','th','tl','id','pt','ru','uk','tr','it','nl','pl','el','cs','fa','he','sw'];
        var TRANSLATED = ['en'];
        var RTL = ['ar', 'he', 'fa', 'ur'];
        var lang = null;
        try {
          var cookieLang = readCookie('vaipakam_lang');
          if (cookieLang && SUPPORTED.indexOf(cookieLang) !== -1) {
            lang = cookieLang;
          } else {
            var storedLang = localStorage.getItem('vaipakam:language');
            if (storedLang && SUPPORTED.indexOf(storedLang) !== -1) {
              lang = storedLang;
            } else if (navigator.language) {
              var nav = navigator.language.toLowerCase().split('-')[0];
              if (SUPPORTED.indexOf(nav) !== -1) lang = nav;
            }
          }
        } catch (_) { /* stay with the static lang="en" */ }
        if (lang && TRANSLATED.indexOf(lang) === -1) lang = null;
        if (lang) {
          document.documentElement.setAttribute('lang', lang);
          document.documentElement.setAttribute('dir', RTL.indexOf(lang) !== -1 ? 'rtl' : 'ltr');
        }
      })();
    </script>
    <style>
      /* A boot splash that paints from the HTML itself, before the bundle
         loads, replaced the moment React mounts into #root. */
      #boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        background: #f6f7f9;
        color: #101828;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      :root[data-theme='dark'] #boot-splash {
        background: #0c111d;
        color: #f5f7fa;
      }
      #boot-splash .boot-mark { display: flex; align-items: center; gap: 10px; font-size: 1.25rem; font-weight: 700; }
      /* The www shield mark, one file per colourway, switched by the theme the
         bootstrap above stamped (not by the system scheme, which the user may
         have overridden). */
      #boot-splash .boot-badge { width: 34px; height: 34px; }
      #boot-splash .boot-badge--dark { display: none; }
      :root[data-theme='dark'] #boot-splash .boot-badge--dark { display: block; }
      :root[data-theme='dark'] #boot-splash .boot-badge--light { display: none; }
      #boot-splash .boot-spinner {
        width: 26px; height: 26px; border: 3px solid rgba(128, 128, 128, 0.3);
        border-top-color: #4f46e5; border-radius: 50%; animation: boot-spin 0.8s linear infinite;
      }
      :root[data-theme='dark'] #boot-splash .boot-spinner { border-top-color: #a5b4fc; }
      #boot-splash .boot-hint { font-size: 0.85rem; opacity: 0.7; max-width: 36ch; text-align: center; }
      #boot-splash .boot-reload {
        padding: 8px 22px; border: 0; border-radius: 9px; background: #4f46e5; color: #fff;
        font: inherit; font-weight: 600; cursor: pointer;
      }
      :root[data-theme='dark'] #boot-splash .boot-reload { background: #a5b4fc; color: #1e1b4b; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash .boot-spinner { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot-splash">
        <div class="boot-mark">
          <img class="boot-badge boot-badge--light" src="/icon-light.svg" alt="" width="34" height="34" />
          <img class="boot-badge boot-badge--dark" src="/icon-dark.svg" alt="" width="34" height="34" />
          Vaipakam
        </div>
        <div class="boot-spinner" role="status" aria-label="Loading"></div>
        <div class="boot-hint">Starting up…</div>
      </div>
    </div>
    <script>
      // The splash must be able to FAIL loudly: if a chunk drops, React never
      // mounts and nothing inside the bundle can rescue the page, so this
      // handler lives in the HTML, independent of every asset that can fail.
      setTimeout(function () {
        var splash = document.getElementById('boot-splash');
        if (!splash) return;
        var spinner = splash.querySelector('.boot-spinner');
        if (spinner) spinner.style.display = 'none';
        var hint = splash.querySelector('.boot-hint');
        if (hint) {
          hint.textContent = 'This is taking longer than it should — check your connection and reload.';
          hint.style.opacity = '1';
        }
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'boot-reload';
        btn.textContent = 'Reload';
        btn.addEventListener('click', function () { location.reload(); });
        splash.appendChild(btn);
      }, 20000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
